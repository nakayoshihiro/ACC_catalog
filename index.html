                                                        onChange={e => {
                                                            if (e.target.value && !(caseData.tools || []).includes(e.target.value)) {
                                                                handleUpdate('tools', [...(caseData.tools || []), e.target.value]);
                                                            }
                                                        }}
                                                    >
                                                        <option value="">+ ツールを追加</option>
                                                        {getEnabledItems('tools').filter(t => !(caseData.tools || []).includes(t.label)).map(t => (
                                                            <option key={t.id} value={t.label}>{t.label}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            ) : (
                                                <span className="text-sm font-medium text-gray-800">{(caseData.tools || []).join('、')}</span>
                                            )}
                                        </div>

                                        {/* 4. 導入サービス (Service) - Master Select */}
                                        <div className="border-b border-gray-100 pb-2">
                                            <p className="text-xs text-gray-400 font-bold mb-1">導入サービス</p>
                                            {isEditMode ? (
                                                <select
                                                    className="text-sm font-medium text-gray-800 border rounded px-1 w-full"
                                                    value={caseData.service || ''}
                                                    onChange={e => handleUpdate('service', e.target.value)}
                                                >
                                                    <option value="">未選択</option>
                                                    {getEnabledItems('services').map(i => <option key={i.id} value={i.label}>{i.label}</option>)}
                                                </select>
                                            ) : (
                                                <span className="text-sm font-medium text-gray-800">{caseData.service}</span>
                                            )}
                                        </div>

                                        {/* 5. お客様の依頼タスク (Request Task) - Major Tasks Multi-Select */}
                                        <div className="border-b border-gray-100 pb-2">
                                            <p className="text-xs text-gray-400 font-bold mb-1">お客様の依頼タスク</p>
                                            {(() => {
                                                // Normalize tasks to ensure we display Major labels
                                                // (For existing data, 'tasks' might contain medium labels or major labels)
                                                // Let's assume we want to show/edit purely Major Labels here.
                                                // If mixed, we might need logic. For now, assume 'tasks' stores strings.
                                                const currentTasks = caseData.tasks || [];
                                                return (
                                                    <div className="flex flex-col gap-1">
                                                        {isEditMode ? (
                                                            <div className="flex flex-col gap-2">
                                                                <div className="flex flex-wrap gap-2">
                                                                    {currentTasks.map((t, i) => (
                                                                        <span key={i} className="flex items-center gap-1 bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-xs font-bold border border-blue-100">
                                                                            {t}
                                                                            <button onClick={() => handleUpdate('tasks', currentTasks.filter((_, idx) => idx !== i))} className="text-blue-400 hover:text-red-500">×</button>
                                                                        </span>
                                                                    ))}
                                                                </div>
                                                                <select
                                                                    className="text-sm border rounded px-1 w-full"
                                                                    value=""
                                                                    onChange={e => {
                                                                        if (e.target.value && !currentTasks.includes(e.target.value)) {
                                                                            handleUpdate('tasks', [...currentTasks, e.target.value]);
                                                                        }
                                                                    }}
                                                                >
                                                                    <option value="">+ タスク(大項目)を追加</option>
                                                                    {getEnabledItems('taskMajors').filter(m => !currentTasks.includes(m.label)).map(m => (
                                                                        <option key={m.id} value={m.label}>{m.label}</option>
                                                                    ))}
                                                                </select>
                                                                <p className="text-[10px] text-gray-400">※大項目のみ選択可能です</p>
                                                            </div>
                                                        ) : (
                                                            <div className="flex flex-wrap gap-2">
                                                                {currentTasks.map((task, i) => (
                                                                    <button
                                                                        key={i}
                                                                        onClick={() => handleTaskClick(task)}
                                                                        className="text-xs font-bold text-primary border border-primary/30 px-3 py-1 rounded-full hover:bg-primary hover:text-white transition-colors flex items-center gap-1"
                                                                    >
                                                                        {task} <span className="material-symbols-outlined text-[10px]">open_in_new</span>
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })()}
                                        </div>
                                    </div>

                                    {/* Right Column */}
                                    <div className="flex flex-col gap-6">
                                        {/* 1. 従業員数 (Employee Count) - Master Select */}
                                        <div className="border-b border-gray-100 pb-2">
                                            <p className="text-xs text-gray-400 font-bold mb-1">従業員数</p>
                                            {isEditMode ? (
                                                <select
                                                    className="text-sm font-medium text-gray-800 border rounded px-1 w-full"
                                                    value={caseData.employeeCount || ''}
                                                    onChange={e => handleUpdate('employeeCount', e.target.value)}
                                                >
                                                    <option value="">未選択</option>
                                                    {getEnabledItems('employeeScales').map(i => <option key={i.id} value={i.label}>{i.label}</option>)}
                                                </select>
                                            ) : (
                                                <span className="text-sm font-medium text-gray-800">{caseData.employeeCount}</span>
                                            )}
                                        </div>

                                        {/* 2. 企業フェーズ (Phase) - Master Select */}
                                        <div className="border-b border-gray-100 pb-2">
                                            <p className="text-xs text-gray-400 font-bold mb-1">企業フェーズ</p>
                                            {isEditMode ? (
                                                <select
                                                    className="text-sm font-medium text-gray-800 border rounded px-1 w-full"
                                                    // Fallback for Phase which might be stored distinctly or in tags
                                                    value={caseData.phase || ''}
                                                    onChange={e => handleUpdate('phase', e.target.value)}
                                                >
                                                    <option value="">未選択</option>
                                                    {getEnabledItems('phases').map(i => <option key={i.id} value={i.label}>{i.label}</option>)}
                                                </select>
                                            ) : (
                                                <span className="text-sm font-medium text-gray-800">{caseData.phase}</span>
                                            )}
                                        </div>

                                        {/* 3. 導入時期 (Start Date) - Manual Input */}
                                        <div className="border-b border-gray-100 pb-2">
                                            <p className="text-xs text-gray-400 font-bold mb-1">導入時期</p>
                                            <EditableText value={caseData.startMonth} onChange={v => handleUpdate('startMonth', v)} className="text-sm font-medium text-gray-800" />
                                        </div>

                                        {/* 4. ご契約時間 (Contract Hours) - Manual Input */}
                                        <div className="border-b border-gray-100 pb-2">
                                            <p className="text-xs text-gray-400 font-bold mb-1">ご契約時間</p>
                                            <EditableText value={caseData.contractHours} onChange={v => handleUpdate('contractHours', v)} className="text-sm font-medium text-gray-800" />
                                        </div>

                                        {/* 5. コミュニケーションツール (Comm Tool) - Master Select */}
                                        <div className="border-b border-gray-100 pb-2">
                                            <p className="text-xs text-gray-400 font-bold mb-1">コミュニケーションツール</p>
                                            {isEditMode ? (
                                                <select
                                                    className="text-sm font-medium text-gray-800 border rounded px-1 w-full"
                                                    value={caseData.commTool || ''}
                                                    onChange={e => handleUpdate('commTool', e.target.value)}
                                                >
                                                    <option value="">未選択</option>
                                                    {getEnabledItems('commTools').map(i => <option key={i.id} value={i.label}>{i.label}</option>)}
                                                </select>
                                            ) : (
                                                <span className="text-sm font-medium text-gray-800">{caseData.commTool}</span>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* その他タグ (Other Tags) Section REMOVED (Moved to Header) */}

                        {/* Issues & Results */}
                        <section>
                            <h2 className="text-xl font-bold text-primary mb-6">課題と成果</h2>
                            <div className="border-t border-primary/30 pt-6">
                                <div className="mb-10">
                                    <h3 className="flex items-center gap-2 text-sm font-bold text-gray-800 mb-4 flex items-center gap-2">導入前の課題</h3>
                                    <div className="bg-white p-2 rounded-lg">
                                        <EditableArray
                                            items={caseData.challenges}
                                            onChange={v => handleUpdate('challenges', v)}
                                            wrapperClass="flex flex-col gap-3"
                                            itemClass="flex items-start gap-2 text-sm text-gray-600 before:content-['▶'] before:text-blue-400 before:text-[10px]"
                                        />
                                    </div>
                                </div>
                                <div>
                                    <h3 className="flex items-center gap-2 text-sm font-bold text-gray-800 mb-4 flex items-center gap-2">導入後の成果</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {caseData.metricsCards.map((m, i) => (
                                            <div key={i} className="bg-blue-50/50 rounded-lg p-6 flex flex-col items-center justify-center gap-1 text-center border border-blue-100 mb-2">
                                                <EditableText value={m.label} onChange={v => handleMetricUpdate(i, 'label', v)} className="text-xs font-bold text-gray-500 mb-1 block" />
                                                <div className="flex items-baseline justify-center gap-1 w-full">
                                                    <EditableText value={m.value} onChange={v => handleMetricUpdate(i, 'value', v)} className="text-3xl font-black text-accent" />
                                                    <EditableText value={m.suffix} onChange={v => handleMetricUpdate(i, 'suffix', v)} className="text-sm font-bold text-accent" />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-8 flex flex-col gap-3">
                                        <EditableArray
                                            items={caseData.resultsBullets || []}
                                            onChange={v => handleUpdate('resultsBullets', v)}
                                            wrapperClass="flex flex-col gap-3"
                                            // Fixed: Checkmark only, no circle
                                            itemClass="flex items-center gap-2 text-sm text-gray-700 before:content-['✓'] before:text-primary before:font-black before:mr-1"
                                            onRenderItem={(text, isEdit) => (
                                                <div className="flex items-center gap-2 text-sm text-gray-700">
                                                    <span className="text-primary font-black">✓</span>
                                                    <span>{text}</span>
                                                </div>
                                            )}
                                        />
                                    </div>
                                </div>
                            </div>
                        </section>


                    </main >
                </div >
            );
        };

        // --- Screen 2: Workflow Page (Refactored) ---
        const WorkflowPage = () => {
            const { workflowId } = useParams();
            const { workflows, updateWorkflow, isEditMode } = useApp();
            const { showToast } = useToast();
            const [activeStep, setActiveStep] = useState(null);
            const [localIconSelector, setLocalIconSelector] = useState({ isOpen: false, onSelect: null });

            const workflow = useMemo(() => workflows.find(w => w.id === workflowId) || workflows[0], [workflows, workflowId]);

            useEffect(() => {
                if (workflow && workflow.steps.length > 0 && activeStep === null) {
                    setActiveStep(workflow.steps[0].id);
                }
            }, [workflow, activeStep]);

            if (!workflow) return <div>Workflow Not Found</div>;

            // --- Normalization Logic ---
            const normalizeStepData = (step, index) => {
                if (!step) return null;
                // split items to support "Title\nDesc" format if needed, but for now just pass through
                return {
                    original: step,
                    stepNumber: index + 1,
                    id: step.id,
                    title: step.title || `Step ${index + 1}`,
                    role: step.role || '弊社', // Default role
                    owner: step.role === 'お客様' ? 'client' : 'caster',
                    icon: step.icon || 'task',
                    issue: step.problem || '', // Map 'problem' to 'issue'
                    solution: step.solution || '',
                    procedures: Array.isArray(step.items) ? step.items : [],
                    task: step.task || '',
                    taskIcon: step.taskIcon || ''
                };
            };

            const activeStepObj = workflow.steps.find(s => s.id === activeStep);
            const activeStepIndex = workflow.steps.findIndex(s => s.id === activeStep);
            const activeStepData = normalizeStepData(activeStepObj, activeStepIndex);

            // --- Handlers ---
            const handleStepUpdate = (originalField, val) => {
                if (activeStepIndex === -1) return;
                const newSteps = [...workflow.steps];
                newSteps[activeStepIndex] = { ...newSteps[activeStepIndex], [originalField]: val };
                updateWorkflow({ ...workflow, steps: newSteps });
            };

            const handleKPIUpdate = (key, val) => {
                updateWorkflow({ ...workflow, kpis: { ...workflow.kpis, [key]: val } });
                showToast('保存しました');
            };

            const addStep = () => {
                const newId = `step-${Date.now()}`;
                const newStep = {
                    id: newId,
                    title: "新規ステップ",
                    role: "弊社",
                    icon: "task",
                    items: ["手順を入力してください"],
                    problem: "",
                    solution: ""
                };
                updateWorkflow({ ...workflow, steps: [...workflow.steps, newStep] });
                setActiveStep(newId);
                showToast('ステップを追加しました');
            };

            const deleteStep = (e, stepId) => {
                e.stopPropagation();
                if (!confirm('このステップを削除しますか？')) return;
                const newSteps = workflow.steps.filter(s => s.id !== stepId);
                updateWorkflow({ ...workflow, steps: newSteps });
                if (activeStep === stepId && newSteps.length > 0) setActiveStep(newSteps[0].id);
                showToast('ステップを削除しました');
            };

            const updateProcedure = (idx, val) => {
                const newItems = [...activeStepData.procedures];
                newItems[idx] = val;
                handleStepUpdate('items', newItems);
            };

            const addProcedure = () => {
                const newItems = [...activeStepData.procedures, "新しい手順"];
                handleStepUpdate('items', newItems);
            };

            const deleteProcedure = (idx) => {
                const newItems = activeStepData.procedures.filter((_, i) => i !== idx);
                handleStepUpdate('items', newItems);
            };

            return (
                <div className="min-h-screen bg-[#F3F5F8] flex flex-col font-body pb-10">
                    <Header />

                    <main className="max-w-[1200px] mx-auto w-full px-8 py-10 flex flex-col gap-8">
                        {/* Title Section */}
                        <div className="flex flex-col gap-2">
                            <div className="flex items-center gap-2 mb-2">
                                <Link to={`/detail/${workflow.caseId || '001'}`} className="text-gray-400 text-xs font-bold hover:text-primary transition-colors flex items-center gap-1">
                                    <span className="material-symbols-outlined text-[14px]">arrow_back</span> 事例詳細に戻る
                                </Link>
                            </div>
                            <EditableText value={workflow.title} className="text-3xl font-black text-gray-900 leading-normal" onChange={v => { updateWorkflow({ ...workflow, title: v }); showToast('保存しました'); }} />
                        </div>

                        <div className="flex flex-col gap-4">
                            <div className="flex flex-col gap-4">
                                {/* Header Info (Major/Minor Task, Tags) */}
                                {(() => {
                                    // Resolve Tasks
                                    const workTaskName = workflow.taskName || '業務フロー';
                                    const medium = (useApp().masters.taskMediums || []).find(t => t.label === workTaskName);
                                    const major = medium ? (useApp().masters.taskMajors || []).find(t => t.id === medium.parentId) : null;
                                    const majorLabel = major ? major.label : '業務タスク';

                                    // Find related case to get tags
                                    const relatedCase = useApp().cases.find(c => c.id === workflow.caseId);
                                    const issueTags = relatedCase ? (relatedCase.issueIds || []).map(id => (useApp().masters.issues || []).find(i => i.id === id)).filter(Boolean) : [];
                                    const outcomeTags = relatedCase ? (relatedCase.outcomeIds || []).map(id => (useApp().masters.outcomes || []).find(i => i.id === id)).filter(Boolean) : [];

                                    return (
                                        <div className="flex flex-col gap-2">
                                            {/* Major Task (Top Left) */}
                                            <p className="text-lg font-bold text-gray-500">{majorLabel}</p>

                                            {/* Minor Task + ID */}
                                            <div className="flex items-baseline gap-3">
                                                <EditableText value={workTaskName} className="text-3xl font-black text-gray-900" onChange={v => { updateWorkflow({ ...workflow, taskName: v }); showToast('保存しました'); }} />
                                                <span className="text-xs text-gray-400 font-mono">ID: {workflow.id}</span>
                                            </div>

                                            {/* Tags Row */}
                                            <div className="flex flex-wrap gap-2 mt-1">
                                                {/* Minor Task Tag (Redundant but requested 'under major task') */}
                                                <span className="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded font-bold">{workTaskName}</span>

                                                {issueTags.map((issue, i) => (
                                                    <span key={i} className={`text-xs font-bold px-2 py-1 rounded-full flex items-center gap-1 bg-blue-50 text-blue-700`}>
                                                        <span className="material-symbols-outlined text-[14px]">{issue.icon}</span> {issue.label}
                                                    </span>
                                                ))}
                                                {outcomeTags.map((outcome, i) => (
                                                    <span key={i} className="text-xs font-bold px-2 py-1 rounded-full flex items-center gap-1 bg-orange-50 text-orange-700">
                                                        <span className="material-symbols-outlined text-[14px]">check_circle</span> {outcome.label}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })()}

                                {/* KPI Banner - 動的配列ベース */}
                                {(() => {
                                    // KPIカードを配列形式に変換（後方互換性対応）
                                    const kpiCards = workflow.kpiCards || [
                                        { id: 'kpi-1', label: '総所要日数', value: workflow.kpis?.totalDaysAfter || '-' },
                                        { id: 'kpi-2', label: '作業時間', value: workflow.kpis?.workHours || '-' },
                                        { id: 'kpi-3', label: '平均処理件数', value: workflow.kpis?.avgCount || '-' },
                                        { id: 'kpi-4', label: 'コスト', value: workflow.kpis?.cost || '-' },
                                        { id: 'kpi-5', label: '決算月', value: workflow.kpis?.fiscalMonth || '-' },
                                    ];

                                    const updateKpiCard = (idx, field, val) => {
                                        const newCards = [...kpiCards];
                                        newCards[idx] = { ...newCards[idx], [field]: val };
                                        updateWorkflow({ ...workflow, kpiCards: newCards });
                                        showToast('保存しました');
                                    };

                                    const addKpiCard = () => {
                                        if (kpiCards.length >= 6) {
                                            showToast('KPIカードは最大6個です', 'error');
                                            return;
                                        }
                                        const newCards = [...kpiCards, { id: `kpi-${Date.now()}`, label: '新規KPI', value: '-' }];
                                        updateWorkflow({ ...workflow, kpiCards: newCards });
                                        showToast('KPIカードを追加しました');
                                    };

                                    const deleteKpiCard = (idx) => {
                                        if (kpiCards.length <= 1) {
                                            showToast('最低1つは必要です', 'error');
                                            return;
                                        }
                                        const newCards = kpiCards.filter((_, i) => i !== idx);
                                        updateWorkflow({ ...workflow, kpiCards: newCards });
                                        showToast('KPIカードを削除しました');
                                    };

                                    // グリッドの列数を動的に決定（1-3:そのまま、4-6:3列）
                                    const gridCols = kpiCards.length <= 3 ? `repeat(${kpiCards.length}, 1fr)` : 'repeat(3, 1fr)';

                                    return (
                                        <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-200">
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="text-xs text-gray-400 font-bold">KPI指標</span>
                                                {isEditMode && kpiCards.length < 6 && (
                                                    <button onClick={addKpiCard} className="text-[10px] bg-green-50 text-green-600 px-2 py-1 rounded hover:bg-green-100 flex items-center gap-1">
                                                        <span className="material-symbols-outlined text-[12px]">add</span>追加
                                                    </button>
                                                )}
                                            </div>
                                            <div className="grid gap-4" style={{ gridTemplateColumns: gridCols }}>
                                                {kpiCards.map((kpi, idx) => (
                                                    <div key={kpi.id} className="flex flex-col items-center text-center relative group">
                                                        {isEditMode && (
                                                            <button onClick={() => deleteKpiCard(idx)} className="absolute -top-2 -right-2 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                                <span className="material-symbols-outlined text-[12px]">close</span>
                                                            </button>
                                                        )}
                                                        <EditableText value={kpi.label} className="text-[10px] text-gray-400 font-bold mb-1" onChange={v => updateKpiCard(idx, 'label', v)} />
                                                        <EditableText value={kpi.value} className="text-2xl text-primary font-black" onChange={v => updateKpiCard(idx, 'value', v)} />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>

                            {/* Main Layout 6:4 */}
                            <div className="grid grid-cols-1 lg:grid-cols-[6fr_4fr] gap-6 items-stretch pb-8">

                                {/* Left Column: Flow Steps */}
                                <div className="bg-white rounded-xl p-6 shadow-sm flex flex-col">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-lg font-bold text-gray-800">業務の流れ</h2>
                                        {isEditMode && (
                                            <button onClick={addStep} className="text-xs font-bold bg-green-50 text-green-600 px-3 py-1 rounded hover:bg-green-100 flex items-center gap-1">
                                                <span className="material-symbols-outlined text-[14px]">add</span>ステップ追加
                                            </button>
                                        )}
                                    </div>
                                    <div className="relative pl-4 space-y-0 flex-grow">
                                        <div className="absolute left-[27px] top-4 bottom-4 w-[2px] bg-gray-100 z-0"></div>
                                        {workflow.steps.map((step, i) => {
                                            const isActive = step.id === activeStep;
                                            const stepRole = step.role || '弊社';
                                            return (
                                                <div key={step.id}
                                                    onClick={() => setActiveStep(step.id)}
                                                    className={`relative z-10 flex gap-4 p-4 rounded-lg cursor-pointer transition-all ${isActive ? 'bg-blue-50' : 'hover:bg-gray-50'}`}>

                                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center shrink-0 border-2 ${isActive ? (stepRole === 'お客様' ? 'bg-orange-500 border-orange-500' : 'bg-primary border-primary') + ' text-white' : 'bg-white border-gray-200 ' + (stepRole === 'お客様' ? 'text-orange-400' : 'text-blue-400')}`}>
                                                        <span className="material-symbols-outlined text-[24px]">{step.icon || 'task'}</span>
                                                    </div>
                                                    <div className="flex flex-col pt-1 flex-1 gap-1">
                                                        <p className={`text-base font-bold ${isActive ? 'text-primary' : 'text-gray-700'}`}>{step.title}</p>
                                                        <div className="flex flex-col gap-1 items-start">
                                                            <p className="text-[10px] text-gray-400 font-bold">{stepRole}</p>
                                                            {/* 説明文: アイコンなし、編集可能 */}
                                                            <div className="w-full">
                                                                <EditableText
                                                                    value={step.task}
                                                                    className="text-xs text-gray-600 block min-h-[1em]"
                                                                    placeholder={isEditMode ? "説明文を入力" : ""}
                                                                    onChange={(v) => {
                                                                        const newSteps = [...workflow.steps];
                                                                        newSteps[i] = { ...newSteps[i], task: v };
                                                                        updateWorkflow({ ...workflow, steps: newSteps });
                                                                    }}
                                                                />
                                                            </div>
                                                            {/* 時間: 時計アイコンあり */}
                                                            {(step.time || isEditMode) && (
                                                                <div className="flex items-center gap-1 text-[10px] text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full mt-1">
                                                                    <span className="material-symbols-outlined text-[12px]">schedule</span>
                                                                    <EditableText
                                                                        value={step.time || ''}
                                                                        placeholder="1営業日"
                                                                        onChange={(v) => {
                                                                            const newSteps = [...workflow.steps];

        // --- Screen 3: Results Page ---
        const ResultsPage = () => {
            const { filteredCases, masters, filters, isEditMode, addCase, deleteCase } = useApp();
            const navigate = useNavigate();

            // 現在の検索条件を取得
            const getActiveConditions = () => {
                const conditions = [];
                filters.selectedIssues.forEach(id => {
                    const item = (masters.issues || []).find(i => i.id === id);
                    if (item) conditions.push(item.label);
                });
                filters.selectedOutcomes.forEach(id => {
                    const item = (masters.outcomes || []).find(o => o.id === id);
                    if (item) conditions.push(item.label);

                if (filters.industry !== 'すべて' && filters.industry) conditions.push(filters.industry);
                if (filters.taskMajor !== 'すべて' && filters.taskMajor) conditions.push(filters.taskMajor);
                if (filters.taskMedium !== 'すべて' && filters.taskMedium) conditions.push(filters.taskMedium);
                if (filters.tool !== 'すべて' && filters.tool) conditions.push(filters.tool);
                // Dynamic
                if (filters.dynamic) {
                    Object.entries(filters.dynamic).forEach(([key, val]) => {
                        if (val && val !== 'すべて') {
                            // Try to find label from master if possible

                            conditions.push(def ? def.label : val);
                        }
                    });

                return conditions;
            };
            const activeConditions = getActiveConditions();

            const handleCreate = () => {
                const newId = String(filteredCases.length + 1).padStart(3, '0');

                    metricsCards: [],
                    issueIds: [],
                    outcomeIds: [],

            return (

                                        <span className="material-symbols-outlined text-[16px]">tune</span> 条件を変更する
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col gap-3">
                            {filteredCases.map(c => (
                                <article key={c.id} className="relative bg-white rounded-xl shadow-sm hover:shadow-md border border-gray-100 p-5 transition-all">
                                    {isEditMode && (
                                        <button onClick={(e) => { e.preventDefault(); if (confirm('削除しますか？')) deleteCase(c.id); }}
                                            className="absolute top-2 right-2 p-1 text-gray-300 hover:text-red-500 z-10 transition-colors">
                                            <span className="material-symbols-outlined">delete</span>
                                        </button>
                                    )}

                                    <div className="flex flex-col lg:flex-row gap-6">
                                        {/* Col 1: Basic Info */}
                                        <div className="lg:w-[28%] flex flex-col gap-1 lg:border-r border-gray-100 lg:pr-4">
                                            <p className="text-[10px] font-mono text-gray-400 font-bold tracking-wider">UseID: {c.id}</p>
                                            <h3 className="text-lg font-bold text-gray-800 leading-tight mb-1">{c.title}</h3>
                                            <div className="flex flex-wrap gap-1.5">
                                                <span className="text-[10px] text-gray-600 bg-gray-50 border border-gray-200 px-1.5 py-0.5 rounded whitespace-nowrap">{c.employeeCount}</span>
                                                {c.tools.map((t, i) => <span key={i} className="text-[10px] text-gray-600 bg-gray-50 border border-gray-200 px-1.5 py-0.5 rounded whitespace-nowrap">{t}</span>)}
                                                <span className="text-[10px] text-gray-600 bg-gray-50 border border-gray-200 px-1.5 py-0.5 rounded whitespace-nowrap">{c.service}</span>
                                            </div>
                                        </div>

                                        {/* Col 2: Task & Issues */}
                                        <div className="lg:w-[42%] flex flex-col gap-3 justify-center">
                                            <div className="flex items-start gap-2">
                                                <span className="text-[10px] text-gray-400 font-bold w-12 pt-1 flex items-center gap-1 whitespace-nowrap"><span className="material-symbols-outlined text-[12px]">task</span>依頼タスク</span>
                                                <div className="flex flex-wrap gap-1.5 flex-1">
                                                    {c.tasks.map((t, i) => (
                                                        <span key={i} className="text-[11px] font-medium text-gray-600 bg-gray-100 px-2 py-0.5 rounded">{t}</span>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="flex items-start gap-2">
                                                <span className="text-[10px] text-gray-400 font-bold w-12 pt-1 flex items-center gap-1"><span className="material-symbols-outlined text-[12px]">error</span>課題</span>
                                                <div className="flex flex-wrap gap-1.5 flex-1">
                                                    {/* 課題タグをマスタから取得して表示 */}
                                                    {(c.issueIds || []).map((issueId, i) => {
                                                        const issue = (masters.issues || []).find(iss => iss.id === issueId);
                                                        if (!issue) return null;
                                                        const colorMap = { blue: 'bg-blue-50 text-blue-700 border-blue-100', red: 'bg-red-50 text-red-700 border-red-100', purple: 'bg-purple-50 text-purple-700 border-purple-100', yellow: 'bg-yellow-50 text-yellow-700 border-yellow-100', teal: 'bg-teal-50 text-teal-700 border-teal-100' };
                                                        const bg = colorMap[issue.color] || colorMap.blue;
                                                        return (
                                                            <span key={i} className={`text-[10px] font-bold border px-2 py-0.5 rounded-full flex items-center gap-1 ${bg}`}>
                                                                <span className="material-symbols-outlined text-[12px]">{issue.icon}</span>
                                                                {issue.label}
                                                            </span>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Col 3: Results & Action */}
                                        <div className="lg:w-[30%] flex flex-col justify-between items-end border-l border-gray-100 pl-4 gap-2">
                                            <div className="w-full">
                                                <p className="text-[10px] text-accent font-bold mb-1 flex items-center gap-1"><span className="material-symbols-outlined text-[12px]">check_circle</span>成果・インパクト</p>
                                                <div className="flex flex-col gap-1.5 items-start">
                                                    {/* 成果タグをマスタから取得して表示 */}
                                                    {(c.outcomeIds || []).map((outcomeId, i) => {
                                                        const outcome = (masters.outcomes || []).find(o => o.id === outcomeId);
                                                        if (!outcome) return null;
                                                        return (
                                                            <span key={i} className="text-[11px] font-bold text-orange-700 bg-orange-50 border border-orange-100 px-2 py-0.5 rounded-full flex items-center gap-1 w-full">
                                                                <span className="material-symbols-outlined text-[12px]">check_circle</span> {outcome.label}
                                                            </span>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                            <Link to={`/detail/${c.id}`} className="bg-primary hover:bg-primary-dark text-white text-xs font-bold py-2.5 px-6 rounded shadow-md hover:shadow-lg transition-all flex items-center gap-1 w-full justify-center">
                                                詳細を見る <span className="material-symbols-outlined text-[16px]">chevron_right</span>
                                            </Link>
                                        </div>
                                    </div>
                                </article>
                            ))}
                        </div>

                        {/* Pagination (Static) */}
                        <div className="flex justify-center mt-4">
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 flex items-center p-1 gap-1">
                                <button className="w-8 h-8 flex items-center justify-center text-gray-400 hover:bg-gray-50 rounded"><span className="material-symbols-outlined text-[18px]">chevron_left</span></button>
                                <button className="w-8 h-8 flex items-center justify-center bg-primary text-white font-bold rounded">1</button>
                                <button className="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-50 rounded font-bold text-sm">2</button>
                                <button className="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-50 rounded font-bold text-sm">3</button>
                                <span className="w-8 h-8 flex items-center justify-center text-gray-400 text-xs">...</span>
                                <button className="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-50 rounded font-bold text-sm">8</button>
                                <button className="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-50 rounded"><span className="material-symbols-outlined text-[18px]">chevron_right</span></button>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };



        // --- Screen 4: New Case Page (Admin Only) ---
        const NewCasePage = () => {
            const { isAdmin, masters, definitions, addCase, addWorkflow, workflows, getEnabledItems } = useApp();
            const navigate = useNavigate();
            const { showToast } = useToast();

            // 管理者のみアクセス可能
            if (!isAdmin) {
                return <Navigate to="/" replace />;
            }

            // state for dynamic fields
            const [formData, setFormData] = useState({
                useId: '',
                title: '',
                industryId: 'ind-other',
                // other dynamic fields will be stored in 'dynamicValues' map or directly in formData with category ID keys
                // For simplicity, let's mix them but be careful with keys
                selectedMajorId: '', // For UI selection state
                taskIds: [],
                issueIds: [],
                outcomeIds: [],
                // Default props
                service: 'BPO',
                fiscalMonth: '3月',
                startMonth: '',
                contractHours: '',
            });
            // Dynamic values container
            const [dynamicValues, setDynamicValues] = useState({});

            const [errors, setErrors] = useState({});

            // Initialize default values for single-select dynamic fields
            useEffect(() => {
                const defaults = {};
                definitions.forEach(def => {
                    if (def.type === 'user' || ['tools', 'phases', 'commTools'].includes(def.id)) {
                        // If it's single select (logic wise, though our definitions don't clearly distinct single/multi except by usage. 
                        // Let's assume 'tools' is multi, others single for now based on legacy?
                        // Actually improved: Let's treat 'tools' as multi, others as single for backwards compat, 
                        // OR just use 'tools' array for tools.
                    }
                });
            }, []);

            const handleChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
                if (errors[field]) {
                    setErrors(prev => ({ ...prev, [field]: null }));
                }
            };

            const handleDynamicChange = (categoryId, value) => {
                setDynamicValues(prev => ({ ...prev, [categoryId]: value }));
            };

            const toggleArrayItem = (field, id) => {
                setFormData(prev => ({
                    ...prev,
                    [field]: prev[field].includes(id)
                        ? prev[field].filter(i => i !== id)
                        : [...prev[field], id]
                }));
            };

            const toggleDynamicArrayItem = (categoryId, id) => {
                setDynamicValues(prev => {
                    const current = prev[categoryId] || [];
                    const next = current.includes(id) ? current.filter(x => x !== id) : [...current, id];
                    return { ...prev, [categoryId]: next };
                });
            };

            const validate = () => {
                const newErrors = {};
                if (!formData.useId.trim()) newErrors.useId = 'UseIDは必須です';
                if (formData.taskIds.length === 0) newErrors.taskIds = 'タスクを1つ以上選択してください';
                return newErrors;
            };

            const handleSubmit = () => {
                const validationErrors = validate();
                if (Object.keys(validationErrors).length > 0) {
                    setErrors(validationErrors);
                    showToast('入力エラーがあります', 'error');
                    return;
                }

                // マスタからlabelを取得
                const getLabel = (list, id) => {
                    const item = list.find(i => i.id === id);
                    return item ? item.label : id;
                };

                // Prepare Dynamic Fields
                const finalDynamicValues = {};
                definitions.forEach(def => {
                    // Skip system fixed ones that are handled explicitly if needed, but here we handle "phase", "commTool", "tools" specifically
                    // to match legacy data structure for backward compatibility.
                    // LEGACY MAPPING:
                    // phases -> formData.phase (Label)
                    // commTools -> formData.commTool (Label)
                    // tools -> formData.tools (Array of Labels)
                    // employeeScales -> formData.employeeCount (Label)

                    const val = dynamicValues[def.id];
                    if (!val) return; // skip empty

                    if (def.id === 'phases') {
                        // stored in dynamicValues as ID, need Label
                        finalDynamicValues.phase = getLabel(masters[def.id], val);
                    } else if (def.id === 'commTools') {
                        finalDynamicValues.commTool = getLabel(masters[def.id], val);
                    } else if (def.id === 'employeeScales') {
                        finalDynamicValues.employeeCount = getLabel(masters[def.id], val);
                    } else if (def.id === 'tools') {
                        // Array of IDs -> Array of Labels
                        finalDynamicValues.tools = (val || []).map(id => getLabel(masters[def.id], id));
                    } else {
                        // Other dynamic user fields: Store as prop strictly? OR just mix in?
                        // For now, store in 'tags' if it's an array, or specific prop.
                        // Simple approach: Store directly in case object with category ID as key (Label value)
                        if (Array.isArray(val)) {
                            finalDynamicValues[def.id] = val.map(id => getLabel(masters[def.id], id));
                        } else {
                            finalDynamicValues[def.id] = getLabel(masters[def.id], val);
                        }
                    }
                });

                const newCase = {
                    id: formData.useId.trim(),
                    title: formData.title.trim() || getLabel(masters.industries, formData.industryId),
                    industry: getLabel(masters.industries, formData.industryId),
                    service: formData.service.trim() || 'BPO',
                    fiscalMonth: formData.fiscalMonth || '3月',
                    startMonth: formData.startMonth.trim() || '2024年1月',
                    contractHours: formData.contractHours.trim() || '-',
                    workflowId: `wf-${formData.useId.trim()}`,
                    workflowId: `wf-${formData.useId.trim()}`,
                    tasks: formData.taskIds.map(id => getLabel(masters.taskMediums, id)),
                    challenges: [],
                    challenges: [],
                    resultsBullets: [],
                    metricsCards: [
                        { label: '削減効果', value: '-', suffix: '' },
                        { label: '効率化', value: '-', suffix: '' },
                        { label: '改善度', value: '-', suffix: '' }
                    ],
                    issueIds: formData.issueIds,
                    outcomeIds: formData.outcomeIds,
                    tags: [], // Could aggregate dynamic tags here
                    taskWorkflowMap: {},

                    // Legacy Defaults (will be overwritten by finalDynamicValues if set)
                    employeeCount: '-',
                    phase: '未設定',
                    commTool: 'Slack',
                    tools: [],

                    ...finalDynamicValues
                };

                // 事例追加
                addCase(newCase);

                // ワークフロー自動生成
                const wfId = `wf-${newCase.id}`;
                if (!workflows.find(w => w.id === wfId)) {
                    const template = workflows.find(w => w.id === 'wf-001') || INITIAL_WORKFLOWS[0];
                    const newWf = JSON.parse(JSON.stringify(template));
                    newWf.id = wfId;
                    newWf.caseId = newCase.id;
                    newWf.title = newCase.title || newCase.industry;
                    newWf.taskName = newCase.tasks[0] || '業務フロー';
                    addWorkflow(newWf);
                }

                showToast('事例を追加しました');
                navigate(`/detail/${newCase.id}`);
            };

            return (
                <div className="min-h-screen bg-[#F3F5F8] flex flex-col font-body pb-10">
                    <Header />

                    <main className="max-w-[800px] mx-auto w-full px-8 py-10 bg-white min-h-[600px] shadow-sm my-6 rounded-xl">
                        <div className="flex items-center gap-3 mb-8">
                            <div className="bg-green-100 p-2 rounded-lg text-green-600">
                                <span className="material-symbols-outlined text-[28px]">add_circle</span>
                            </div>
                            <div>
                                <h2 className="text-2xl font-bold text-gray-800">新規事例追加</h2>
                                <p className="text-xs text-gray-500">検索に影響する項目はマスタから選択してください</p>
                            </div>
                        </div>

                        <div className="flex flex-col gap-8">
                            {/* 基本情報 */}
                            <section>
                                <h3 className="text-lg font-bold text-gray-800 border-b border-gray-200 pb-2 mb-4">基本情報</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-xs font-bold text-gray-700 mb-1 block">UseID <span className="text-red-500">*</span></label>
                                        <input
                                            type="text"
                                            className={`w-full border rounded-md p-2 text-sm ${errors.useId ? 'border-red-500' : 'border-gray-300'}`}
                                            value={formData.useId}
                                            onChange={e => handleChange('useId', e.target.value)}
                                            placeholder="例: 001"
                                        />
                                        {errors.useId && <p className="text-xs text-red-500 mt-1">{errors.useId}</p>}
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-700 mb-1 block">タイトル</label>
                                        <input
                                            type="text"
                                            className="w-full border border-gray-300 rounded-md p-2 text-sm"
                                            value={formData.title}
                                            onChange={e => handleChange('title', e.target.value)}
                                            placeholder="空の場合は業種名が入ります"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-700 mb-1 block">業種 <span className="text-blue-500 text-[10px]">（選択式）</span></label>
                                        <select
                                            className="w-full border border-gray-300 rounded-md p-2 text-sm"
                                            value={formData.industryId}
                                            onChange={e => handleChange('industryId', e.target.value)}
                                        >
                                            {getEnabledItems('industries').map(ind => <option key={ind.id} value={ind.id}>{ind.label}</option>)}
                                        </select>
                                    </div>

                                    {/* Render other single-select fields from definitions */}
                                    {definitions.filter(d => ['phases', 'commTools', 'employeeScales'].includes(d.id) || (d.type === 'user' && d.id !== 'tools')).map(def => (
                                        <div key={def.id}>
                                            <label className="text-xs font-bold text-gray-700 mb-1 block">{def.label}</label>
                                            <select
                                                className="w-full border border-gray-300 rounded-md p-2 text-sm"
                                                value={dynamicValues[def.id] || ''}
                                                onChange={e => handleDynamicChange(def.id, e.target.value)}
                                            >
                                                <option value="">未選択</option>
                                                {getEnabledItems(def.id).map(item => <option key={item.id} value={item.id}>{item.label}</option>)}
                                            </select>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            {/* タスク選択 (Hierarchical) */}
                            <section>
                                <h3 className="text-lg font-bold text-gray-800 border-b border-gray-200 pb-2 mb-4">
                                    タスク <span className="text-red-500 text-sm">*</span>
                                    <span className="text-blue-500 text-xs font-normal ml-2">（選択式・複数可）</span>
                                </h3>
                                {errors.taskIds && <p className="text-xs text-red-500 mb-2">{errors.taskIds}</p>}
                                <div className="flex flex-col gap-4">
                                    {/* Updated Hierarchical Selection UI */}
                                    {(() => {
                                        const majors = (masters.taskMajors || []).filter(t => t.isEnabled);
                                        const mediums = (masters.taskMediums || []).filter(t => t.isEnabled);
                                        const selectedMajor = majors.find(m => m.id === formData.selectedMajorId);
                                        const children = selectedMajor ? mediums.filter(t => t.parentId === selectedMajor.id) : [];

                                        return (
                                            <div className="flex flex-col gap-4">
                                                {/* Step 1: Major Select */}
                                                <div>
                                                    <h4 className="text-xs font-bold text-gray-500 mb-1">1. 大項目を選択</h4>
                                                    <select
                                                        className="w-full border border-gray-300 rounded-md p-2 text-sm"
                                                        value={formData.selectedMajorId}
                                                        onChange={e => handleChange('selectedMajorId', e.target.value)}
                                                    >
                                                        <option value="">選択してください</option>
                                                        {majors.map(m => (
                                                            <option key={m.id} value={m.id}>{m.label}</option>
                                                        ))}
                                                    </select>
                                                </div>

                                                {/* Step 2: Medium Select */}
                                                {formData.selectedMajorId && (
                                                    <div className="bg-gray-50 p-3 rounded-lg animate-fade-in">
                                                        <h4 className="text-xs font-bold text-gray-700 mb-2 border-b border-gray-200 pb-1">2. 中項目を選択（複数可） - {selectedMajor?.label}</h4>
                                                        {children.length === 0 ? (
                                                            <p className="text-xs text-gray-400">該当するタスクはありません</p>
                                                        ) : (
                                                            <div className="flex flex-wrap gap-2">
                                                                {children.map(t => (
                                                                    <button
                                                                        key={t.id}
                                                                        onClick={() => toggleArrayItem('taskIds', t.id)}
                                                                        className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${formData.taskIds.includes(t.id) ? 'bg-primary text-white border-primary' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-400'}`}
                                                                    >
                                                                        {formData.taskIds.includes(t.id) && <span className="material-symbols-outlined text-[10px] mr-1">check</span>}
                                                                        {t.label}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                )}

                                                {/* Show Selected Summary */}
                                                {formData.taskIds.length > 0 && (
                                                    <div className="mt-2">
                                                        <p className="text-[10px] text-gray-400 mb-1">選択中のタスク:</p>
                                                        <div className="flex flex-wrap gap-1">
                                                            {formData.taskIds.map(tid => {
                                                                const t = mediums.find(x => x.id === tid);
                                                                return t ? (
                                                                    <span key={tid} className="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded border border-blue-100">{t.label}</span>
                                                                ) : null;
                                                            })}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })()}
                                </div>
                            </section>

                            {/* ツール選択 (Multi) */}
                            <section>
                                <h3 className="text-lg font-bold text-gray-800 border-b border-gray-200 pb-2 mb-4">
                                    使用ツール
                                    <span className="text-blue-500 text-xs font-normal ml-2">（選択式・複数可）</span>
                                </h3>
                                <div className="flex flex-wrap gap-2">
                                    {getEnabledItems('tools').map(t => (
                                        <button
                                            key={t.id}
                                            onClick={() => toggleDynamicArrayItem('tools', t.id)}
                                            className={`px-3 py-1.5 rounded-full text-sm font-medium border transition-colors ${(dynamicValues['tools'] || []).includes(t.id) ? 'bg-primary text-white border-primary' : 'bg-white text-gray-600 border-gray-300 hover:border-primary'}`}
                                        >
                                            {t.label}
                                        </button>
                                    ))}
                                </div>
                            </section>

                            {/* 課題タグ */}
                            <section>
                                <h3 className="text-lg font-bold text-gray-800 border-b border-gray-200 pb-2 mb-4">
                                    課題タグ
                                </h3>
                                <div className="flex flex-wrap gap-2">
                                    {getEnabledItems('issues').map(issue => {
                                        const colorMap = { blue: 'border-blue-500 bg-blue-50', red: 'border-red-500 bg-red-50', purple: 'border-purple-500 bg-purple-50', yellow: 'border-yellow-500 bg-yellow-50', teal: 'border-teal-500 bg-teal-50', gray: 'border-gray-500 bg-gray-50' };
                                        const isSelected = formData.issueIds.includes(issue.id);
                                        return (
                                            <button
                                                key={issue.id}
                                                onClick={() => toggleArrayItem('issueIds', issue.id)}
                                                className={`px-3 py-1.5 rounded-full text-sm font-medium border-2 transition-colors flex items-center gap-1 ${isSelected ? colorMap[issue.color] || colorMap.blue : 'bg-white text-gray-600 border-gray-200 hover:border-gray-400'}`}
                                            >
                                                <span className="material-symbols-outlined text-[16px]">{issue.icon}</span>
                                                {issue.label}
                                            </button>
                                        );
                                    })}
                                </div>
                            </section>

                            {/* 成果タグ */}
                            <section>
                                <h3 className="text-lg font-bold text-gray-800 border-b border-gray-200 pb-2 mb-4">
                                    成果タグ
                                </h3>
                                <div className="flex flex-wrap gap-2">
                                    {getEnabledItems('outcomes').map(outcome => {
                                        const isSelected = formData.outcomeIds.includes(outcome.id);
                                        return (
                                            <button
                                                key={outcome.id}
                                                onClick={() => toggleArrayItem('outcomeIds', outcome.id)}
                                                className={`px-3 py-1.5 rounded-full text-sm font-medium border-2 transition-colors flex items-center gap-1 ${isSelected ? 'bg-orange-100 border-orange-500 text-orange-700' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-400'}`}
                                            >
                                                <span className="material-symbols-outlined text-[16px]">check_circle</span>
                                                {outcome.label}
                                            </button>
                                        );
                                    })}
                                </div>
                            </section>

                            {/* その他情報 */}
                            <section>
                                <h3 className="text-lg font-bold text-gray-800 border-b border-gray-200 pb-2 mb-4">その他情報</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label className="text-xs font-bold text-gray-700 mb-1 block">導入サービス</label>
                                        <input
                                            type="text"
                                            className="w-full border border-gray-300 rounded-md p-2 text-sm"
                                            value={formData.service}
                                            onChange={e => handleChange('service', e.target.value)}
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-700 mb-1 block">決算月</label>
                                        <input
                                            type="text"
                                            className="w-full border border-gray-300 rounded-md p-2 text-sm"
                                            value={formData.fiscalMonth}
                                            onChange={e => handleChange('fiscalMonth', e.target.value)}
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-700 mb-1 block">導入時期</label>
                                        <input
                                            type="text"
                                            className="w-full border border-gray-300 rounded-md p-2 text-sm"
                                            value={formData.startMonth}
                                            onChange={e => handleChange('startMonth', e.target.value)}
                                            placeholder="例: 2024年1月"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-700 mb-1 block">契約時間</label>
                                        <input
                                            type="text"
                                            className="w-full border border-gray-300 rounded-md p-2 text-sm"
                                            value={formData.contractHours}
                                            onChange={e => handleChange('contractHours', e.target.value)}
                                            placeholder="例: 30時間"
                                        />
                                    </div>
                                </div>
                            </section>
                        </div>

                        {/* ボタン */}
                        <div className="flex justify-between items-center mt-10 pt-6 border-t border-gray-200">
                            <button
                                onClick={() => navigate(-1)}
                                className="text-gray-500 hover:text-gray-700 flex items-center gap-1"
                            >
                                <span className="material-symbols-outlined text-[18px]">arrow_back</span>
                                キャンセル
                            </button>
                            <button
                                onClick={handleSubmit}
                                className="bg-primary hover:bg-primary-dark text-white font-bold px-8 py-3 rounded-lg shadow-lg flex items-center gap-2 transition-transform active:scale-95"
                            >
                                <span className="material-symbols-outlined text-[20px]">add</span>
                                事例を追加
                            </button>
                        </div>
                    </main>
                </div>
            );
        };


        const App = () => {
            return (
                <HashRouter>
                    <ToastProvider>
                        <AppProvider>
                            <AdminBar />
                            <Routes>
                                <Route path="/" element={<HomePage />} />
                                <Route path="/new" element={<NewCasePage />} />
                                <Route path="/results" element={<ResultsPage />} />
                                <Route path="/detail/:caseId" element={<CaseDetailPage />} />
                                <Route path="/workflow/:workflowId" element={<WorkflowPage />} />
                                <Route path="/detail" element={<Navigate to="/results" replace />} />
                                <Route path="/workflow" element={<Navigate to="/workflow/wf-001" replace />} />
                            </Routes>
                        </AppProvider>
                    </ToastProvider>
                </HashRouter>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>

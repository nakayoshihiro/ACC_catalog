        const ToastProvider = ({ children }) => {
            const [toast, setToast] = useState(null);
            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };
            return (
                <ToastContext.Provider value={{ showToast }}>
                    {children}
                    {toast && (
                        <div className={`fixed bottom-20 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-lg shadow-lg text-white font-bold text-sm ${toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'}`}>
                            {toast.message}
                        </div>
                    )}
                </ToastContext.Provider>
            );
        };
        const useToast = () => useContext(ToastContext);

        const AppProvider = ({ children }) => {
            // Load from LS or init
            const [cases, setCases] = useState(() => {
                const saved = localStorage.getItem('app_cases');
                return saved ? JSON.parse(saved) : INITIAL_CASES;
            });
            const [workflows, setWorkflows] = useState(() => {
                const saved = localStorage.getItem('app_workflows');
                return saved ? JSON.parse(saved) : INITIAL_WORKFLOWS;
            });
            // === マスタデータ管理 ===
            const [definitions, setDefinitions] = useState(() => {
                const saved = localStorage.getItem('app_definitions');
                // Migration Check: If 'tasks' exists, force reset to new structure
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.find(d => d.id === 'tasks')) {
                        console.log('Migrating definitions: Found legacy "tasks", resetting to INITIAL_DEFINITIONS');
                        return INITIAL_DEFINITIONS;
                    }
                    return parsed;
                }
                return INITIAL_DEFINITIONS;
            });
            const [masters, setMasters] = useState(() => {
                const saved = localStorage.getItem('app_masters');
                let parsed = saved ? JSON.parse(saved) : null;

                // Migration Check: If 'tasks' exists in masters, force reset to INITIAL_MASTERS (or migrate if we wanted to simplify)
                if (parsed && parsed['tasks']) {
                    console.log('Migrating masters: Found legacy "tasks", resetting to INITIAL_MASTERS');
                    parsed = JSON.parse(JSON.stringify(INITIAL_MASTERS)); // Deep copy to avoid ref issues
                }

                if (!parsed) parsed = JSON.parse(JSON.stringify(INITIAL_MASTERS));

                // Ensure all definitions have a corresponding key in masters
                const allKeys = definitions.map(d => d.id);
                allKeys.forEach(key => {
                    if (!parsed[key]) parsed[key] = [];
                });
                return parsed;
            });

            // === 検索フィルター状態 ===
            const [filters, setFilters] = useState({
                selectedIssues: [],
                selectedOutcomes: [],
                industry: 'すべて',
                taskMajor: 'すべて', // New
                taskMedium: 'すべて', // New
                tool: 'すべて',
                dynamic: {}
            });

            // Persist
            useEffect(() => { localStorage.setItem('app_cases', JSON.stringify(cases)); }, [cases]);
            useEffect(() => { localStorage.setItem('app_workflows', JSON.stringify(workflows)); }, [workflows]);
            useEffect(() => { localStorage.setItem('app_masters', JSON.stringify(masters)); }, [masters]);
            useEffect(() => { localStorage.setItem('app_definitions', JSON.stringify(definitions)); }, [definitions]);

            // Edit State
            const [isAdmin, setIsAdmin] = useState(() => sessionStorage.getItem('isAdmin') === 'true');
            const [isEditMode, setIsEditMode] = useState(false);

            useEffect(() => {
                sessionStorage.setItem('isAdmin', isAdmin);
                if (!isAdmin) setIsEditMode(false);
            }, [isAdmin]);

            // === フィルタリングロジック ===
            const filteredCases = useMemo(() => {
                return cases.filter(c => {
                    // 課題フィルター (ID match)
                    if (filters.selectedIssues.length > 0) {
                        const caseIssues = c.issueIds || [];
                        if (!filters.selectedIssues.some(id => caseIssues.includes(id))) return false;
                    }
                    // 成果フィルター (ID match)
                    if (filters.selectedOutcomes.length > 0) {
                        const caseOutcomes = c.outcomeIds || [];
                        if (!filters.selectedOutcomes.some(id => caseOutcomes.includes(id))) return false;
                    }
                    // 業種フィルター (Label match)
                    if (filters.industry !== 'すべて' && c.industry !== filters.industry) return false;

                    // タスクフィルター (Major/Medium)
                    if (filters.taskMedium !== 'すべて') {
                        const taskItem = (masters.taskMediums || []).find(t => t.id === filters.taskMedium);
                        if (taskItem && !(c.tasks || []).includes(taskItem.label)) return false;
                    } else if (filters.taskMajor !== 'すべて') {
                        // Major selected: Match if case has any Medium task belonging to this Major, OR the Major label itself
                        const childTasks = (masters.taskMediums || []).filter(t => t.parentId === filters.taskMajor).map(t => t.label);
                        const majorLabel = (masters.taskMajors || []).find(t => t.id === filters.taskMajor)?.label;

                        const targetLabels = [...childTasks];
                        if (majorLabel) targetLabels.push(majorLabel);

                        const caseTasks = c.tasks || [];
                        if (!caseTasks.some(t => targetLabels.includes(t))) return false;
                    }

                    // ツールフィルター (Label match)
                    if (filters.tool !== 'すべて' && !(c.tools || []).includes(filters.tool)) return false;

                    // サービスフィルター (Label match)
                    if (filters.service !== 'すべて' && c.service !== filters.service) return false;

                    // Dynamic Filters (Generic)
                    if (filters.dynamic) {
                        for (const [key, val] of Object.entries(filters.dynamic)) {
                            if (val === 'すべて') continue;

                            // Special handling for 'services' if user selects it from "Other Conditions" section (though we might move it to main filter?)
                            // If 'services' is handled as dynamic filter:
                            if (key === 'services') {
                                // Match label (val is ID)
                                const serviceLabel = (masters.services || []).find(s => s.id === val)?.label;
                                if (serviceLabel && c.service !== serviceLabel) return false;
                                continue;
                            }

                            // General dynamic tag check
                            // Simplified for other props stored directly or in tags
                            let caseVal = null;
                            if (key === 'phases') caseVal = c.phase;
                            else if (key === 'employeeScales') caseVal = c.employeeCount;
                            else if (key === 'commTools') caseVal = c.commTool;
                            else if (key === 'industries') caseVal = c.industry;
                            else if (c[key]) caseVal = c[key]; // direct property
                            else if ((c.tags || []).includes(val)) caseVal = val; // tags array backup (val is label here)

                            const masterItem = (masters[key] || []).find(i => i.id === val);
                            const label = masterItem ? masterItem.label : val;

                            if (caseVal !== label) return false;
                        }
                    }

                    return true;
                });
            }, [cases, filters, masters]);

            // === フィルター操作関数 ===
            const toggleIssue = (id) => setFilters(prev => ({
                ...prev,
                selectedIssues: prev.selectedIssues.includes(id)
                    ? prev.selectedIssues.filter(i => i !== id)
                    : [...prev.selectedIssues, id]
            }));
            const toggleOutcome = (id) => setFilters(prev => ({
                ...prev,
                selectedOutcomes: prev.selectedOutcomes.includes(id)
                    ? prev.selectedOutcomes.filter(i => i !== id)
                    : [...prev.selectedOutcomes, id]
            }));
            const toggleFilterList = (key, val) => setFilters(prev => ({
                ...prev,
                [key]: prev[key].includes(val) ? prev[key].filter(v => v !== val) : [...prev[key], val]
            }));
            const setFilterValue = (key, value) => setFilters(prev => ({ ...prev, [key]: value }));
            const setDynamicFilter = (category, value) => setFilters(prev => ({
                ...prev,
                dynamic: { ...prev.dynamic, [category]: value }
            }));

            const clearFilter = (key, value, isDynamic = false) => {
                if (isDynamic) {
                    setFilters(prev => ({ ...prev, dynamic: { ...prev.dynamic, [key]: 'すべて' } }));
                } else if (key === 'selectedIssues' || key === 'selectedOutcomes') {
                    setFilters(prev => ({ ...prev, [key]: prev[key].filter(v => v !== value) }));
                } else {
                    setFilters(prev => ({ ...prev, [key]: 'すべて' }));
                }
            };
            const clearAllFilters = () => setFilters({
                selectedIssues: [], selectedOutcomes: [],
                industry: 'すべて', taskMajor: 'すべて', taskMedium: 'すべて', tool: 'すべて', service: 'すべて',
                dynamic: {}
            });

            // === マスタ更新関数（Core） ===
            const updateMasters = (newMasters) => setMasters(newMasters);
            const addMasterItem = (category, item) => {
                setMasters(prev => ({ ...prev, [category]: [...(prev[category] || []), item] }));
            };
            const updateMasterItem = (category, id, updates) => {
                setMasters(prev => ({
                    ...prev,
                    [category]: (prev[category] || []).map(item =>
                        (typeof item === 'object' && item.id === id) ? { ...item, ...updates } : item
                    )
                }));
            };
            const deleteMasterItem = (category, id) => {
                setMasters(prev => ({
                    ...prev,
                    [category]: (prev[category] || []).filter(item =>
                        typeof item === 'object' ? item.id !== id : item !== id
                    )
                }));
            };

            // === Definition Handlers ===
            const addDefinition = (def) => {
                setDefinitions(prev => [...prev, def]);
                // Also initialize empty master list if needed
                if (!masters[def.id]) {
                    setMasters(prev => ({ ...prev, [def.id]: [] }));
                }
            };
            const updateDefinition = (id, updates) => {
                setDefinitions(prev => prev.map(d => d.id === id ? { ...d, ...updates } : d));
            };
            const deleteDefinition = (id) => {
                if (!confirm('このカテゴリを削除すると、含まれるすべてのタグも削除されます。よろしいですか？')) return;
                setDefinitions(prev => prev.filter(d => d.id !== id));
                // Clean up masters
                setMasters(prev => {
                    const next = { ...prev };
                    delete next[id];
                    return next;
                });
            };

            // === Strict Helper: Get Enabled & Non-Empty Items ===
            const getEnabledItems = (categoryKey) => {
                return (masters[categoryKey] || []).filter(item => item && item.isEnabled !== false && item.label && item.label.trim() !== '');
            };

            // Actions
            const updateCase = (updatedCase) => {
                setCases(prev => prev.map(c => c.id === updatedCase.id ? updatedCase : c));
            };
            const addCase = (newCase) => setCases(prev => [...prev, newCase]);
            const deleteCase = (id) => setCases(prev => prev.filter(c => c.id !== id));
            const updateWorkflow = (updatedWf) => {
                setWorkflows(prev => prev.map(w => w.id === updatedWf.id ? updatedWf : w));
            };
            const addWorkflow = (newWf) => setWorkflows(prev => [...prev, newWf]);

            // === ヘルパー関数: label→ID変換 ===
            const getMasterItemByLabelOrId = (masterList, value, defaultId = null) => {
                if (!value || !masterList) return defaultId;
                const trimmed = value.trim();
                // IDで検索
                let found = masterList.find(item => item.id === trimmed);
                if (found) return found.id;
                // labelで検索
                found = masterList.find(item => item.label === trimmed);
                if (found) return found.id;
                // 見つからない場合はデフォルト（その他）に落とす
                return defaultId;
            };

            // === ヘルパー関数: マスタからlabelを取得 ===
            const getMasterLabel = (masterList, id) => {
                if (!masterList || !id) return id;
                const found = masterList.find(item => item.id === id);
                return found ? found.label : id;
            };

            // === CSV解析ヘルパー（カンマ対応） ===
            const parseCSVLine = (line) => {
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        result.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current.trim());
                return result;
            };

            // === ワークフロー自動生成 ===
            const generateWorkflowForCase = (caseData) => {
                const wfId = `wf-${caseData.id}`;

                // 既存チェック - 既にあれば上書きしない
                if (workflows.find(w => w.id === wfId)) {
                    return wfId;
                }

                // テンプレート(wf-001)をdeep copy
                const template = workflows.find(w => w.id === 'wf-001') || INITIAL_WORKFLOWS[0];
                const newWorkflow = JSON.parse(JSON.stringify(template));

                newWorkflow.id = wfId;
                newWorkflow.caseId = caseData.id;
                newWorkflow.title = caseData.title || caseData.industry || '新規事例';
                newWorkflow.taskName = (caseData.tasks && caseData.tasks[0]) || '業務フロー';

                // ステップの課題・解決策・手順はテンプレのまま（後でUIで編集可能）
                addWorkflow(newWorkflow);

                return wfId;
            };

            // === Add-only CSVインポート（新規追加のみ、既存は絶対に上書きしない） ===
            const importCSVAddOnly = (csvText) => {
                try {
                    const lines = csvText.trim().split('\n');
                    if (lines.length < 2) {
                        return { added: 0, skipped: 0, errors: 1, errorMessages: ['CSVにデータ行がありません'] };
                    }

                    const header = parseCSVLine(lines[0]);
                    const getCol = (row, colName) => {
                        const idx = header.indexOf(colName);
                        return idx >= 0 ? row[idx] : '';
                    };

                    let added = 0, skipped = 0, errors = 0;
                    const errorMessages = [];
                    const newCasesToAdd = [];
                    const existingIds = cases.map(c => c.id);

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;

                        const cols = parseCSVLine(line);
                        const useId = getCol(cols, 'useId');

                        // useId必須チェック
                        if (!useId) {
                            errors++;
                            errorMessages.push(`行${i + 1}: useIdが空です`);
                            continue;
                        }

                        // 既存チェック - 存在したらスキップ（絶対に上書きしない）
                        if (existingIds.includes(useId)) {
                            skipped++;
                            continue;
                        }

                        // 業種のlabel→ID変換
                        const industryInput = getCol(cols, 'industry');
                        const industryId = getMasterItemByLabelOrId(masters.industries, industryInput, 'ind-other');
                        const industryLabel = getMasterLabel(masters.industries, industryId);

                        // タスク（複数、"|"区切り）
                        // タスク（複数、"|"区切り）
                        const tasksInput = getCol(cols, 'tasks');
                        const taskLabels = tasksInput ? tasksInput.split('|').map(t => {
                            const trimmed = t.trim();
                            // Search Mediums first
                            let id = getMasterItemByLabelOrId(masters.taskMediums, trimmed);
                            if (id) return getMasterLabel(masters.taskMediums, id);

                            // Then Majors
                            id = getMasterItemByLabelOrId(masters.taskMajors, trimmed);
                            if (id) return getMasterLabel(masters.taskMajors, id);

                            return 'その他'; // Fallback
                        }) : [];

                        // 課題タグ（複数、"|"区切り）
                        const issueTagsInput = getCol(cols, 'issueTags');
                        const issueIds = issueTagsInput ? issueTagsInput.split('|').map(t => {
                            return getMasterItemByLabelOrId(masters.issues, t.trim(), 'issue-other');
                        }).filter(Boolean) : [];

                        // 成果タグ（複数、"|"区切り）
                        const outcomeTagsInput = getCol(cols, 'outcomeTags');
                        const outcomeIds = outcomeTagsInput ? outcomeTagsInput.split('|').map(t => {
                            return getMasterItemByLabelOrId(masters.outcomes, t.trim(), 'outcome-other');
                        }).filter(Boolean) : [];

                        // ツール（複数、"|"区切り）
                        const toolsInput = getCol(cols, 'tools');
                        const toolLabels = toolsInput ? toolsInput.split('|').map(t => {
                            const id = getMasterItemByLabelOrId(masters.tools, t.trim(), 'tool-other');
                            return getMasterLabel(masters.tools, id);
                        }) : [];

                        // フェーズ
                        const phaseInput = getCol(cols, 'phase');
                        const phaseId = getMasterItemByLabelOrId(masters.phases, phaseInput, 'phase-unlisted');
                        const phaseLabel = getMasterLabel(masters.phases, phaseId);

                        // コミュニケーションツール
                        const commToolInput = getCol(cols, 'commTool');
                        const commToolId = getMasterItemByLabelOrId(masters.commTools, commToolInput, 'comm-slack');
                        const commToolLabel = getMasterLabel(masters.commTools, commToolId);

                        // サービス
                        const serviceInput = getCol(cols, 'service');
                        const serviceId = getMasterItemByLabelOrId(masters.services, serviceInput, 'service-other');
                        const serviceLabel = getMasterLabel(masters.services, serviceId);

                        const newCase = {
                            id: useId,
                            title: getCol(cols, 'title') || industryLabel,
                            industry: industryLabel,
                            employeeCount: getCol(cols, 'employeeCount') || '-',
                            tools: toolLabels,
                            service: serviceLabel, // Use serviceLabel
                            fiscalMonth: getCol(cols, 'fiscalMonth') || '3月',
                            startMonth: getCol(cols, 'startMonth') || '2024年1月',
                            contractHours: getCol(cols, 'contractHours') || '-',
                            workflowId: `wf-${useId}`,
                            tasks: taskLabels,
                            challenges: [],
                            resultsBullets: [],
                            metricsCards: [
                                { label: '削減効果', value: '-', suffix: '' },
                                { label: '効率化', value: '-', suffix: '' },
                                { label: '改善度', value: '-', suffix: '' }
                            ],
                            issueIds: issueIds,
                            outcomeIds: outcomeIds,
                            phase: phaseLabel,
                            commTool: commToolLabel,
                            tags: [],
                            taskWorkflowMap: {}
                        };

                        newCasesToAdd.push(newCase);
                        existingIds.push(useId); // 同CSV内での重複防止
                        added++;
                    }

                    // 一括追加
                    if (newCasesToAdd.length > 0) {
                        setCases(prev => {
                            const next = [...prev];
                            newCasesToAdd.forEach(nc => {
                                // 既存チェック（念のため二重確認）
                                if (!next.find(c => c.id === nc.id)) {
                                    next.push(nc);
                                }
                            });
                            return next;
                        });

                        // ワークフローも一括生成
                        newCasesToAdd.forEach(nc => generateWorkflowForCase(nc));
                    }

                    return { added, skipped, errors, errorMessages };
                } catch (e) {
                    return { added: 0, skipped: 0, errors: 1, errorMessages: ['インポートエラー: ' + e.message] };
                }
            };

            // 後方互換性のためimportCSVはimportCSVAddOnlyを呼ぶ
            const importCSV = (csvText) => {
                const result = importCSVAddOnly(csvText);
                const message = `追加: ${result.added}件, スキップ: ${result.skipped}件, エラー: ${result.errors}件`;
                if (result.errorMessages.length > 0) {
                    alert(message + '\n\n' + result.errorMessages.slice(0, 5).join('\n'));
                } else {
                    alert(message);
                }
            };

            return (
                <AppContext.Provider value={{
                    cases, workflows, masters, definitions, filters, filteredCases,
                    isAdmin, setIsAdmin,
                    isEditMode, setIsEditMode,
                    updateCase, addCase, deleteCase, updateWorkflow, addWorkflow, importCSV, importCSVAddOnly,
                    generateWorkflowForCase, getMasterItemByLabelOrId, getMasterLabel,
                    toggleIssue, toggleOutcome, toggleFilterList, setFilterValue, setDynamicFilter, clearFilter, clearAllFilters,
                    updateMasters, addMasterItem, updateMasterItem, deleteMasterItem,
                    addDefinition, updateDefinition, deleteDefinition, getEnabledItems
                }}>
                    {children}
                </AppContext.Provider>
            );
        };

        const useApp = () => useContext(AppContext);

        // --- Shared Components for Edit Mode ---
        const PasswordModal = ({ onClose }) => {
            const { setIsAdmin } = useApp();
            const [pass, setPass] = useState("");

            const submit = () => {
                if (pass === ADMIN_PASSWORD) {
                    setIsAdmin(true);
                    onClose();
                } else {
                    alert("パスワードが違います");
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm">
                    <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-xl w-80">
                        <h3 className="text-lg font-bold mb-4 dark:text-white">管理者認証</h3>
                        <input className="w-full border p-2 rounded mb-4 dark:bg-gray-700 dark:text-white"
                            type="password" placeholder="Password"
                            value={pass} onChange={e => setPass(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && submit()}
                        />
                        <div className="flex justify-end gap-2">
                            <button onClick={onClose} className="px-3 py-1 text-gray-500">キャンセル</button>
                            <button onClick={submit} className="px-3 py-1 bg-primary text-white rounded">認証</button>
                        </div>
                    </div>
                </div>
            );
        };

        const CSVModal = ({ onClose }) => {
            const { importCSV } = useApp();
            const navigate = useNavigate();
            const [text, setText] = useState("");

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm">
                    <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-xl w-[700px] max-w-full m-4">
                        <h3 className="text-lg font-bold mb-2 dark:text-white">CSVインポート（Add-only）</h3>
                        <div className="bg-blue-50 border border-blue-200 rounded p-3 mb-3">
                            <p className="text-xs text-blue-800 font-bold mb-1">ℹ️ インポート仕様</p>
                            <ul className="text-xs text-blue-700 list-disc ml-4 space-y-0.5">
                                <li><strong>新規追加のみ</strong>: 既存のuseIdは上書きせずスキップ</li>
                                <li>表記ゆれは自動で「その他」にフォールバック</li>
                                <li>各事例にワークフローが自動生成されます</li>
                            </ul>
                        </div>
                        <p className="text-xs text-gray-500 mb-2">
                            <strong>ヘッダー行必須:</strong> useId,title,industry,employeeCount,tools,tasks,issueTags,outcomeTags,service,fiscalMonth,startMonth,contractHours,phase,commTool
                        </p>
                        <p className="text-[10px] text-gray-400 mb-2">
                            複数値は "|" 区切り（例: freee|MoneyForward）。タグはマスタのlabelまたはIDで指定。
                        </p>
                        <textarea className="w-full h-36 border p-2 rounded mb-4 text-xs font-mono dark:bg-gray-700 dark:text-white"
                            placeholder={"useId,title,industry,employeeCount,tools,tasks,issueTags,outcomeTags,phase,commTool\nTEST-001,テスト企業,IT・通信,100名,freee,請求書処理,リソース不足,コスト30%以上削減,未上場,Slack"}
                            value={text} onChange={e => setText(e.target.value)}
                        />
                        <div className="flex justify-between items-center">
                            <button onClick={() => { onClose(); navigate('/new'); }} className="text-xs text-primary underline">
                                フォームから追加する →
                            </button>
                            <div className="flex gap-2">
                                <button onClick={onClose} className="px-3 py-1.5 text-gray-500 border border-gray-300 rounded">閉じる</button>
                                <button onClick={() => { importCSV(text); onClose(); }} className="px-4 py-1.5 bg-primary text-white rounded font-bold">インポート実行</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminBar = () => {
            const { isAdmin, setIsAdmin, isEditMode, setIsEditMode } = useApp();
            const [showLogin, setShowLogin] = useState(false);
            const [showCSV, setShowCSV] = useState(false);

            if (!isAdmin) {
                return (
                    <>
                        <button onClick={() => setShowLogin(true)}
                            className="fixed bottom-4 right-4 z-50 p-3 bg-gray-800 text-white rounded-full shadow-lg hover:bg-gray-700 opacity-50 hover:opacity-100 transition-opacity">
                            <span className="material-symbols-outlined">lock</span>
                        </button>
                        {showLogin && <PasswordModal onClose={() => setShowLogin(false)} />}
                    </>
                );
            }

            return (
                <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 items-end">
                    <div className="bg-gray-900 text-white p-2 rounded-lg shadow-lg flex items-center gap-3 pr-4 animate-fade-in">
                        <button onClick={() => setIsEditMode(!isEditMode)}
                            className={`flex items-center gap-2 px-3 py-1.5 rounded-md transition-colors ${isEditMode ? 'bg-orange-500 text-white' : 'bg-gray-700 text-gray-300'}`}>
                            <span className="material-symbols-outlined text-[18px]">{isEditMode ? 'edit' : 'visibility'}</span>
                            {isEditMode ? '編集モードON' : '閲覧モード'}
                        </button>

                        {isEditMode && (
                            <button onClick={() => setShowCSV(true)}
                                className="flex items-center gap-2 px-2 py-1.5 text-xs text-gray-300 hover:text-white">
                                <span className="material-symbols-outlined text-[16px]">upload_file</span> CSV
                            </button>
                        )}

                        <button onClick={() => { setIsAdmin(false); setIsEditMode(false); }}
                            className="p-1 hover:bg-gray-700 rounded-full text-gray-400">
                            <span className="material-symbols-outlined text-[18px]">logout</span>
                        </button>
                    </div>
                    {showCSV && <CSVModal onClose={() => setShowCSV(false)} />}
                </div>
            );
        };

        const EditableText = ({ value, onChange, className = "", tag = "span", placeholder = "" }) => {
            const { isEditMode } = useApp();
            if (!isEditMode) return React.createElement(tag, { className }, value || placeholder);

            return (
                <input
                    type="text"
                    value={value || ""}
                    onChange={e => onChange(e.target.value)}
                    className={`editable-input ${className} text-black`}
                    placeholder={placeholder}
                    onClick={e => e.stopPropagation()}
                />
            );
        };

        const EditableArea = ({ value, onChange, className = "" }) => {
            const { isEditMode } = useApp();
            if (!isEditMode) return <p className={className}>{value}</p>;

            return (
                <textarea
                    value={value || ""}
                    onChange={e => onChange(e.target.value)}
                    className={`editable-input min-h-[80px] ${className} text-black`}
                    onClick={e => e.stopPropagation()}
                />
            );
        };

        const EditableArray = ({ items, onChange, itemClass, wrapperClass, placeholder = "項目" }) => {
            const { isEditMode } = useApp();

            const handleItemChange = (idx, val) => {
                const next = [...items];
                next[idx] = val;
                onChange(next);
            };
            const add = () => onChange([...items, ""]);
            const del = (idx) => onChange(items.filter((_, i) => i !== idx));

            if (!isEditMode) {
                return (
                    <div className={wrapperClass}>
                        {items.map((item, i) => (
                            <span key={i} className={itemClass}>{item}</span>
                        ))}
                    </div>
                );
            }

            return (
                <div className={`flex flex-wrap gap-2 ${wrapperClass}`}>
                    {items.map((item, i) => (
                        <div key={i} className="flex items-center gap-1">
                            <input
                                className="border rounded px-1 py-0.5 text-black text-xs w-24"
                                value={item}
                                onChange={e => handleItemChange(i, e.target.value)}
                            />
                            <button onClick={() => del(i)} className="text-red-500 hover:bg-red-50 rounded-full">
                                <span className="material-symbols-outlined text-[14px]">close</span>
                            </button>
                        </div>
                    ))}
                    <button onClick={add} className="px-2 py-0.5 border border-dashed border-gray-400 text-gray-500 text-xs rounded hover:bg-gray-50">
                        + 追加
                    </button>
                </div>
            );
        };

        // --- Icons & UI Components ---
        const Icons = {
            Search: () => <span className="material-symbols-outlined text-[20px]">search</span>,
            // Unified Gray-Blue Color for Number Icons
            One: () => <div className="text-[#5A6C88] font-black border-2 border-[#5A6C88] rounded-full w-6 h-6 flex items-center justify-center text-xs">1</div>,
            Two: () => <div className="text-[#5A6C88] font-black border-2 border-[#5A6C88] rounded-full w-6 h-6 flex items-center justify-center text-xs">2</div>,
            Three: () => <div className="text-[#5A6C88] font-black border-2 border-[#5A6C88] rounded-full w-6 h-6 flex items-center justify-center text-xs">3</div>,
            Four: () => <div className="text-[#5A6C88] font-black border-2 border-[#5A6C88] rounded-full w-6 h-6 flex items-center justify-center text-xs">4</div>,
        };

        // --- Tag Manager Component (Spreadsheet Style) ---
        const TagManager = () => {
            const { masters, definitions, updateMasterItem, addMasterItem, deleteMasterItem, addDefinition, updateDefinition, deleteDefinition, isEditMode } = useApp();

            // Re-sync activeTab if definitions changed (e.g. migration)
            const [activeTab, setActiveTab] = useState('industries'); // Default to first item in new order

            useEffect(() => {
                if (definitions.length > 0 && !definitions.find(d => d.id === activeTab)) {
                    setActiveTab(definitions[0].id);
                }
            }, [definitions, activeTab]);
            const [isAddingCategory, setIsAddingCategory] = useState(false);
            const [newCategoryName, setNewCategoryName] = useState('');

            // definitionsが変わったときにactiveTabが消えていたら先頭に戻す
            useEffect(() => {
                if (definitions.length > 0 && !definitions.find(d => d.id === activeTab)) {
                    setActiveTab(definitions[0].id);
                }
            }, [definitions, activeTab]);

            if (!isEditMode) return null;

            const currentDefinition = definitions.find(d => d.id === activeTab) || {};
            const currentItems = masters[activeTab] || [];

            // Handle Add Item
            const handleAdd = () => {
                let newItem = {
                    id: `${activeTab}-${Date.now()}`,
                    label: '新規項目',
                    isEnabled: true,
                    isSearchable: true // Default true
                };
                if (activeTab === 'taskMediums') {
                    // Default parent to first available major task if any
                    const firstMajor = (masters.taskMajors && masters.taskMajors.length > 0) ? masters.taskMajors[0].id : '';
                    newItem = { ...newItem, parentId: firstMajor };
                } else if (activeTab === 'issues') {
                    newItem = { ...newItem, icon: 'error', color: 'blue' };
                } else if (activeTab === 'outcomes') {
                    newItem = { ...newItem, icon: 'check_circle' };
                }
                addMasterItem(activeTab, newItem);
            };

            const handleAddCategory = () => {
                if (!newCategoryName.trim()) return;
                const newId = `cat-${Date.now()}`;
                addDefinition({
                    id: newId,
                    label: newCategoryName.trim(),
                    type: 'user',
                    isEnabled: true,
                    isSearchable: true
                });
                setNewCategoryName('');
                setIsAddingCategory(false);
                setActiveTab(newId);
            };

            return (
                <section className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-6">
                    <div className="bg-gray-800 text-white p-3 flex justify-between items-center">
                        <h3 className="font-bold flex items-center gap-2">
                            <span className="material-symbols-outlined">table_chart</span> タグマスタ管理
                        </h3>
                        {/* Global Category Edit (Searchable Toggle for Category) */}
                        <div className="flex items-center gap-4">
                            <label className="flex items-center gap-2 cursor-pointer bg-gray-700 px-3 py-1 rounded hover:bg-gray-600 transition-colors">
                                <span className="text-xs">検索画面に追加</span>
                                <input
                                    type="checkbox"
                                    checked={currentDefinition.isSearchable !== false}
                                    onChange={e => updateDefinition(activeTab, { isSearchable: e.target.checked })}
                                    className="accent-primary"
                                />
                            </label>
                            {currentDefinition.type === 'user' && (
                                <button
                                    onClick={() => deleteDefinition(activeTab)}
                                    className="text-xs bg-red-500 hover:bg-red-600 px-2 py-1 rounded flex items-center gap-1 transition-colors"
                                >
                                    <span className="material-symbols-outlined text-[14px]">delete</span> カテゴリ削除
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Tabs */}
                    <div className="flex overflow-x-auto border-b border-gray-200 bg-gray-50 items-end">
                        {definitions.map(def => (
                            <button
                                key={def.id}
                                onClick={() => setActiveTab(def.id)}
                                className={`px-4 py-3 text-sm font-bold whitespace-nowrap transition-colors border-r border-gray-100 ${activeTab === def.id
                                    ? 'bg-white text-primary border-t-2 border-t-primary'
                                    : 'text-gray-500 hover:bg-gray-100'
                                    }`}
                            >
                                {def.label}
                                {!def.isSearchable && <span className="ml-1 text-[10px] text-gray-400"> (非表示)</span>}
                            </button>
                        ))}
                        {/* New Category Tab */}
                        <div className="p-2">
                            {isAddingCategory ? (
                                <div className="flex items-center gap-1 bg-white border rounded px-1 shadow-sm">
                                    <input
                                        autoFocus
                                        className="text-xs py-1 px-1 outline-none w-24"
                                        placeholder="カテゴリ名"
                                        value={newCategoryName}
                                        onChange={e => setNewCategoryName(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && handleAddCategory()}
                                    />
                                    <button onClick={handleAddCategory} className="text-green-500"><span className="material-symbols-outlined text-[16px]">check</span></button>
                                    <button onClick={() => setIsAddingCategory(false)} className="text-gray-400"><span className="material-symbols-outlined text-[16px]">close</span></button>
                                </div>
                            ) : (
                                <button onClick={() => setIsAddingCategory(true)} className="flex items-center gap-1 text-xs text-blue-500 hover:bg-blue-50 px-2 py-1 rounded font-bold">
                                    <span className="material-symbols-outlined text-[14px]">add</span> 追加
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Table */}
                    <div className="overflow-x-auto p-4 max-h-[400px]">
                        <table className="w-full text-sm text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-100 text-gray-600">
                                    <th className="p-2 border border-gray-200 w-12 text-center">操作</th>
                                    <th className="p-2 border border-gray-200">表示名 (Label)</th>
                                    {activeTab === 'taskMediums' && <th className="p-2 border border-gray-200">親カテゴリ (大項目)</th>}
                                    <th className="p-2 border border-gray-200 w-20 text-center">有効</th>
                                    <th className="p-2 border border-gray-200 w-24 text-center">検索画面列挙</th>
                                </tr>
                            </thead>
                            <tbody>
                                {currentItems.map(item => (
                                    <tr key={item.id} className="hover:bg-blue-50">
                                        <td className="p-2 border border-gray-200 text-center">
                                            <button onClick={() => deleteMasterItem(activeTab, item.id)} className="text-gray-400 hover:text-red-500">
                                                <span className="material-symbols-outlined text-[16px]">delete</span>
                                            </button>
                                        </td>
                                        <td className="p-2 border border-gray-200 p-0">
                                            <input
                                                className="w-full h-full p-2 bg-transparent outline-none focus:bg-white"
                                                value={item.label}
                                                onChange={e => updateMasterItem(activeTab, item.id, { label: e.target.value })}
                                            />
                                        </td>
                                        {activeTab === 'taskMediums' && (
                                            <td className="p-2 border border-gray-200 p-0">
                                                <select
                                                    className="w-full h-full p-1 bg-transparent outline-none focus:bg-white text-xs"
                                                    value={item.parentId || ''}
                                                    onChange={e => updateMasterItem(activeTab, item.id, { parentId: e.target.value })}
                                                >
                                                    <option value="">(親なし)</option>
                                                    {(masters.taskMajors || []).map(p => (
                                                        <option key={p.id} value={p.id}>{p.label}</option>
                                                    ))}
                                                </select>
                                            </td>
                                        )}
                                        <td className="p-2 border border-gray-200 text-center">
                                            <input
                                                type="checkbox"
                                                checked={item.isEnabled !== false}
                                                onChange={e => updateMasterItem(activeTab, item.id, { isEnabled: e.target.checked })}
                                                className="w-4 h-4 text-primary focus:ring-primary rounded"
                                            />
                                        </td>
                                        <td className="p-2 border border-gray-200 text-center">
                                            {/* Note: This is per-item searchability. Category searchability also exists header. */}
                                            <input
                                                type="checkbox"
                                                checked={item.isSearchable !== false}
                                                onChange={e => updateMasterItem(activeTab, item.id, { isSearchable: e.target.checked })}
                                                className="w-4 h-4 text-primary focus:ring-primary rounded"
                                            />
                                        </td>
                                    </tr>
                                ))}
                                <tr>
                                    <td colSpan={activeTab === 'tasks' ? 6 : 4} className="p-2 border border-gray-200">
                                        <button onClick={handleAdd} className="w-full text-center text-primary text-xs font-bold py-1 hover:bg-blue-50 rounded dashed border border-blue-200">
                                            + 新規行を追加
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            );
        };


        const Logo = () => (
            <div className="flex items-center gap-2">
                <div className="bg-blue-100 p-1.5 rounded-md text-primary">
                    <span className="material-symbols-outlined text-[24px]">account_balance</span>
                </div>
                <h1 className="text-gray-800 font-bold text-lg tracking-tight">CASTER BIZ accounting</h1>
            </div>
        );

        // === ヘッダーコンポーネント（ID検索機能付き） ===
        const Header = () => {
            const [searchId, setSearchId] = useState('');
            const { cases } = useApp();
            const navigate = useNavigate();
            const { showToast } = useToast();

            const handleSearch = () => {
                if (!searchId.trim()) return;
                const found = cases.find(c => c.id === searchId.trim());
                if (found) {
                    navigate(`/detail/${found.id}`);
                    setSearchId('');
                } else {
                    showToast('該当IDが見つかりませんでした', 'error');
                }
            };

            return (
                <header className="bg-white border-b border-gray-200 sticky top-0 z-50 h-[60px] flex items-center justify-between px-6 shadow-sm">
                    <Link to="/" className="hover:opacity-80 transition-opacity"><Logo /></Link>
                    <div className="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-md px-3 py-1.5 w-[300px]">
                        <span className="text-gray-400 text-sm">#</span>
                        <input
                            type="text"
                            placeholder="ID検索"
                            className="bg-transparent border-none outline-none text-sm w-full"
                            value={searchId}
                            onChange={e => setSearchId(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && handleSearch()}
                        />
                        <button
                            onClick={handleSearch}
                            className="bg-primary hover:bg-primary-dark text-white rounded p-1 flex items-center justify-center w-8 h-8"
                        >
                            <Icons.Search />
                        </button>
                    </div>
                </header>
            );
        };

        // === アイコン選択モーダル ===
        const IconSelector = ({ selected, onSelect, onClose }) => (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50" onClick={onClose}>
                <div className="bg-white p-4 rounded-xl shadow-xl" onClick={e => e.stopPropagation()}>
                    <h4 className="text-sm font-bold mb-3">アイコンを選択</h4>
                    <div className="grid grid-cols-5 gap-2">
                        {AVAILABLE_ICONS.map(icon => (
                            <button
                                key={icon}
                                onClick={() => { onSelect(icon); onClose(); }}
                                className={`w-10 h-10 rounded flex items-center justify-center border ${selected === icon ? 'bg-primary text-white border-primary' : 'border-gray-200 hover:bg-gray-50'}`}
                            >
                                <span className="material-symbols-outlined text-[20px]">{icon}</span>
                            </button>
                        ))}
                    </div>
                </div>
            </div>
        );

        // --- Screen 1: Home Page ---
        const HomePage = () => {
            const navigate = useNavigate();
            const { showToast } = useToast();
            const {
                masters, definitions, filters, filteredCases, isEditMode,
                toggleIssue, toggleOutcome, toggleFilterList, setFilterValue, setDynamicFilter, clearFilter, clearAllFilters,
                addMasterItem, updateMasterItem, deleteMasterItem, getEnabledItems // added getEnabledItems
            } = useApp();

            const [editingItem, setEditingItem] = useState(null);
            const [showIconSelector, setShowIconSelector] = useState(null);

            // 色のマッピング
            const colorToClasses = {
                blue: { bg: 'bg-blue-100', text: 'text-blue-600', hover: 'hover:bg-blue-50', selected: 'bg-blue-500 text-white' },
                red: { bg: 'bg-red-100', text: 'text-red-600', hover: 'hover:bg-red-50', selected: 'bg-red-500 text-white' },
                purple: { bg: 'bg-purple-100', text: 'text-purple-600', hover: 'hover:bg-purple-50', selected: 'bg-purple-500 text-white' },
                yellow: { bg: 'bg-yellow-100', text: 'text-yellow-600', hover: 'hover:bg-yellow-50', selected: 'bg-yellow-500 text-white' },
                teal: { bg: 'bg-teal-100', text: 'text-teal-600', hover: 'hover:bg-teal-50', selected: 'bg-teal-500 text-white' },
            };

            // 選択中の条件を取得
            const getActiveConditions = () => {
                const conditions = [];
                filters.selectedIssues.forEach(id => {
                    const item = masters.issues.find(i => i.id === id);
                    if (item) conditions.push({ key: 'selectedIssues', value: id, label: item.label });
                });
                filters.selectedOutcomes.forEach(id => {
                    const item = masters.outcomes.find(o => o.id === id);
                    if (item) conditions.push({ key: 'selectedOutcomes', value: id, label: item.label });
                });
                if (filters.industry !== 'すべて') conditions.push({ key: 'industry', value: filters.industry, label: filters.industry });

                // Tasks
                if (filters.taskMajor !== 'すべて') {
                    const m = (masters.taskMajors || []).find(t => t.id === filters.taskMajor);
                    if (m) conditions.push({ key: 'taskMajor', value: filters.taskMajor, label: `大項目: ${m.label}` });
                }
                if (filters.taskMedium !== 'すべて') {
                    const m = (masters.taskMediums || []).find(t => t.id === filters.taskMedium);
                    if (m) conditions.push({ key: 'taskMedium', value: filters.taskMedium, label: `タスク: ${m.label}` });
                }
                // Service removed from main conditions, now dynamic
                // if (filters.service !== 'すべて') { // Service Match
                //     conditions.push({ key: 'service', value: filters.service, label: `サービス: ${filters.service}` });
                // }

                if (filters.tool !== 'すべて') conditions.push({ key: 'tool', value: filters.tool, label: filters.tool });

                // Dynamic
                for (const [k, v] of Object.entries(filters.dynamic || {})) {
                    if (v && v !== 'すべて') {
                        const item = (masters[k] || []).find(i => i.id === v);
                        if (item) conditions.push({ key: k, value: v, label: item.label, isDynamic: true });
                    }
                }
                return conditions;
            };

            const activeConditions = getActiveConditions();

            // 新規タグ追加
            const handleAddIssue = () => {
                const newId = 'issue-' + Date.now();
                addMasterItem('issues', { id: newId, label: '新規課題', icon: 'error', color: 'blue' });
                showToast('課題タグを追加しました');
            };
            const handleAddOutcome = () => {
                const newId = 'outcome-' + Date.now();
                addMasterItem('outcomes', { id: newId, label: '新規成果', icon: 'check_circle' });
                showToast('成果タグを追加しました');
            };

            // Safe navigation for Search button
            const handleSearchClick = () => {
                navigate('/results');
            };

            return (
                <div className="min-h-screen bg-[#F3F5F8] flex flex-col font-body pb-[80px]">
                    <Header />

                    <main className="max-w-[1000px] mx-auto w-full px-4 py-8 flex flex-col gap-6">
                        {/* Title */}
                        <div className="flex items-center gap-3 mb-2">
                            <div className="bg-blue-100 p-2 rounded-lg text-primary">
                                <span className="material-symbols-outlined text-[28px]">search</span>
                            </div>
                            <h2 className="text-2xl font-bold text-gray-800">事例検索ポータル</h2>
                        </div>

                        <TagManager />

                        {/* Section 1: 課題から選ぶ */}
                        <section className="bg-white rounded-xl p-6 shadow-sm">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="flex items-center gap-2 text-lg font-bold text-gray-800">
                                    <Icons.One />
                                    課題から選ぶ
                                </h3>
                                {isEditMode && (
                                    <button onClick={handleAddIssue} className="text-xs bg-green-500 text-white px-2 py-1 rounded flex items-center gap-1">
                                        <span className="material-symbols-outlined text-[14px]">add</span> 追加
                                    </button>
                                )}
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                                {getEnabledItems('issues').map(issue => {
                                    const isSelected = filters.selectedIssues.includes(issue.id);
                                    const colors = colorToClasses[issue.color] || colorToClasses.blue;
                                    return (
                                        <div
                                            key={issue.id}
                                            onClick={() => !isEditMode && toggleIssue(issue.id)}
                                            className={`relative rounded-lg p-4 transition-all flex flex-col gap-2 cursor-pointer border-2 ${isSelected ? 'border-primary bg-blue-50' : 'border-transparent bg-gray-50 hover:border-gray-200'}`}
                                        >
                                            <div className={`w-10 h-10 rounded-lg flex items-center justify-center ${isSelected ? 'bg-primary text-white' : colors.bg + ' ' + colors.text}`}>
                                                <span className="material-symbols-outlined text-[24px]">{issue.icon}</span>
                                            </div>
                                            {isEditMode ? (
                                                <div className="flex flex-col gap-1">
                                                    <input
                                                        className="text-sm font-bold border rounded px-1 text-black"
                                                        value={issue.label}
                                                        onChange={e => updateMasterItem('issues', issue.id, { label: e.target.value })}
                                                        onClick={e => e.stopPropagation()}
                                                    />
                                                    <div className="flex gap-1 mt-1">
                                                        <button onClick={e => { e.stopPropagation(); setShowIconSelector(issue.id); }} className="text-[10px] bg-gray-200 px-1 rounded">アイコン</button>
                                                        <button onClick={e => { e.stopPropagation(); deleteMasterItem('issues', issue.id); showToast('削除しました'); }} className="text-[10px] text-red-500">削除</button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <p className="font-bold text-gray-800 text-sm">{issue.label}</p>
                                            )}
                                            {isSelected && <div className="absolute top-2 right-2 text-primary"><span className="material-symbols-outlined text-[18px]">check_circle</span></div>}
                                        </div>
                                    );
                                })}
                            </div>
                            {showIconSelector && <IconSelector selected={(masters.issues.find(i => i.id === showIconSelector) || {}).icon} onSelect={icon => updateMasterItem('issues', showIconSelector, { icon })} onClose={() => setShowIconSelector(null)} />}
                        </section>

                        {/* Section 2: 成果・インパクトから選ぶ */}
                        <section className="bg-white rounded-xl p-6 shadow-sm">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="flex items-center gap-2 text-lg font-bold text-gray-800">
                                    <Icons.Two />
                                    成果・インパクトから選ぶ
                                </h3>
                                {isEditMode && (
                                    <button onClick={handleAddOutcome} className="text-xs bg-green-500 text-white px-2 py-1 rounded flex items-center gap-1">
                                        <span className="material-symbols-outlined text-[14px]">add</span> 追加
                                    </button>
                                )}
                            </div>
                            <div className="flex flex-wrap gap-3">
                                {getEnabledItems('outcomes').map(outcome => {
                                    const isSelected = filters.selectedOutcomes.includes(outcome.id);
                                    return (

                                        </select>
                                        <span className="material-symbols-outlined absolute right-2 top-2.5 text-gray-400 pointer-events-none text-[20px]">expand_more</span>

                                            onChange={e => setFilterValue('taskMedium', e.target.value)}

                        {/* Section 4: その他の条件で絞り込む (Dynamic) */}
                        {(() => {

                            // Exclude those already shown in Section 3 (industries, tasks, tools) and Section 1/2 (issues, outcomes)
                            const fixedIds = ['industries', 'taskMajors', 'taskMediums', 'tools', 'issues', 'outcomes'];
                            const dynamicDefs = definitions.filter(d =>
                                d.isSearchable && d.isEnabled && !fixedIds.includes(d.id)

                                        その他の条件で絞り込む
                                    </h3>
                                    <div className="flex flex-wrap gap-4">
                                        {dynamicDefs.map(def => (
                                            <div key={def.id} className="flex flex-col gap-1 w-48">

                                                    <select
                                                        className="w-full appearance-none border border-gray-300 rounded-md p-2.5 text-sm bg-white focus:ring-2 focus:ring-primary focus:border-transparent font-medium"

                                                        onChange={e => setDynamicFilter(def.id, e.target.value)}
                                                    >
                                                        <option value="すべて">すべて</option>

                                                            <option key={i.id} value={i.id}>{i.label}</option>

                                                    <span className="material-symbols-outlined text-[12px]">close</span>
                                                </button>
                                            </span>
                                        ))

                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Screen 4: Detail Page ---
        const CaseDetailPage = () => {
            const { caseId } = useParams();

            const navigate = useNavigate();

            // Find case
            const caseData = cases.find(c => c.id === caseId);

            if (!caseData) return <div className="p-10 font-bold text-gray-500">Case not found. <Link to="/results" className="text-primary underline">Back</Link></div>;

            const handleUpdate = (field, value) => {
                updateCase({ ...caseData, [field]: value });
            };
            const handleMetricUpdate = (idx, field, value) => {
                const newMetrics = [...(caseData.metricsCards || [])];
                newMetrics[idx] = { ...newMetrics[idx], [field]: value };
                updateCase({ ...caseData, metricsCards: newMetrics });
            };

            // タスククリックでワークフロー遷移
            const handleTaskClick = (task) => {
                const wfId = (caseData.taskWorkflowMap || {})[task] || caseData.workflowId || 'wf-001';
                navigate(`/workflow/${wfId}`);
            };

                                <Link to="/results" className="text-xs font-bold text-gray-500 hover:text-primary flex items-center gap-1">
                                    <span className="material-symbols-outlined text-[14px]">arrow_back</span> 検索一覧へ戻る
                                </Link>
                            </div>
                            <EditableText value={caseData.industry} onChange={v => handleUpdate('industry', v)} className="text-4xl font-black text-gray-900 block mb-3" tag="h1" />

                            {/* 3 Rows of Tags: Issues, Outcomes, Other */}
                            <div className="mt-4 flex flex-col gap-2">
                                {/* Row 1: Issues (Red) */}

                                    const [isIssueSelectorOpen, setIsIssueSelectorOpen] = useState(false);

                                        <div className="flex flex-wrap gap-2 animate-fade-in items-center">
                                            {/* Add Button */}

                                                <div className="relative">
                                                    <button
                                                        onClick={(e) => { e.stopPropagation(); setIsIssueSelectorOpen(!isIssueSelectorOpen); }}
                                                        className="text-xs bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded-full flex items-center gap-1 font-bold text-blue-600 transition-colors border border-blue-100"
                                                    >
                                                        <span className="material-symbols-outlined text-[14px]">{isIssueSelectorOpen ? 'remove' : 'add'}</span>
                                                    </button>
                                                    {isIssueSelectorOpen && (
                                                        <div className="absolute top-full left-0 mt-2 bg-white border border-gray-200 shadow-xl rounded-lg p-3 w-64 z-50 animate-fade-in">
                                                            <div className="flex justify-between items-center mb-2 border-b border-gray-100 pb-1">
                                                                <span className="text-xs font-bold text-gray-500">課題を追加</span>
                                                                <button onClick={() => setIsIssueSelectorOpen(false)} className="text-gray-400 hover:text-gray-600"><span className="material-symbols-outlined text-[14px]">close</span></button>
                                                            </div>
                                                            <div className="max-h-48 overflow-y-auto flex flex-wrap gap-2">
                                                                {(masters.issues || []).map(item => {
                                                                    const isSelected = (caseData.issueIds || []).includes(item.id);
                                                                    if (isSelected) return null;
                                                                    return (
                                                                        <button
                                                                            key={item.id}
                                                                            onClick={() => handleUpdate('issueIds', [...(caseData.issueIds || []), item.id])}
                                                                            className="text-[10px] border border-gray-100 hover:border-blue-300 hover:bg-blue-50 px-2 py-1 rounded-full transition-colors truncate max-w-full"
                                                                        >
                                                                            {item.label}
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            {/* Tags */}
                                            {(caseData.issueIds || []).map((id) => {
                                                const item = (masters.issues || []).find(i => i.id === id);
                                                if (!item) return null;
                                                // 固定配色: 赤 (bg-red-50 text-red-700 border-red-100)
                                                return (
                                                    <span key={id} className="text-xs font-bold px-3 py-1 rounded-full border flex items-center gap-1 bg-red-50 text-red-700 border-red-100">
                                                        {item.label}
                                                        {isEditMode && (
                                                            <button
                                                                onClick={() => handleUpdate('issueIds', caseData.issueIds.filter(tid => tid !== id))}
                                                                className="ml-1 opacity-60 hover:opacity-100"

                                                                ×
                                                            </button>
                                                        )}
                                                    </span>
                                                );
                                            })}
                                        </div>
                                    );
                                })()}

                                            {/* Add Button */}

                                                <div className="relative">
                                                    <button
                                                        onClick={(e) => { e.stopPropagation(); setIsOutcomeSelectorOpen(!isOutcomeSelectorOpen); }}
                                                        className="text-xs bg-orange-50 hover:bg-orange-100 px-2 py-1 rounded-full flex items-center gap-1 font-bold text-orange-600 transition-colors border border-orange-100"

                                                                        >
                                                                            {item.label}
                                                                        </button>
                                                                    );
                                                                })}

                                                    <span key={id} className="text-xs font-bold px-3 py-1 rounded-full border flex items-center gap-1 bg-yellow-50 text-yellow-700 border-yellow-100">

                                                            <button
                                                                onClick={() => handleUpdate('outcomeIds', caseData.outcomeIds.filter(tid => tid !== id))}

                                                                ×
                                                            </button>
                                                        )}
                                                    </span>
                                                );
                                            })}
                                        </div>
                                    );

                                {/* Row 3: Other Tags (Green/Gray) */}

                                    const otherDefs = definitions.filter(d =>
                                        !['industries', 'taskMajors', 'taskMediums', 'services', 'tools', 'employeeScales', 'phases', 'commTools', 'issues', 'outcomes'].includes(d.id)
                                    );

                                    return (
                                        <div className="flex flex-col gap-1 relative">
                                            {/* Edit Mode Toggle for Visibility */}
                                            {isEditMode && (
                                                <div className="flex items-center gap-2 mb-1">
                                                    <input type="checkbox" id="headerTagToggle" checked={showOtherTags} onChange={e => setShowOtherTags(e.target.checked)} />
                                                    <label htmlFor="headerTagToggle" className="text-[10px] text-gray-400 cursor-pointer">その他タグを表示</label>
                                                </div>
                                            )}

                                            {/* Tags Area */}
                                            {showOtherTags && (
                                                <div className="flex flex-wrap gap-2 items-center min-h-[24px]">
                                                    {isEditMode && (
                                                        <div className="relative">
                                                            <button
                                                                onClick={(e) => { e.stopPropagation(); setIsTagSelectorOpen(!isTagSelectorOpen); }}
                                                                className="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded-full flex items-center gap-1 font-bold text-gray-600 transition-colors"
                                                            >
                                                                <span className="material-symbols-outlined text-[14px]">{isTagSelectorOpen ? 'remove' : 'add'}</span>

                                                                        <span className="text-xs font-bold text-gray-500">タグを追加</span>

                                                                    </div>

                                                                        {otherDefs.map(def => (
                                                                            <div key={def.id} className="mb-2 last:mb-0">
                                                                                <p className="text-[10px] font-bold text-gray-300 mb-1">{def.label}</p>
                                                                                <div className="flex flex-wrap gap-1">
                                                                                    {getEnabledItems(def.id).filter(item => !(caseData.tags || []).includes(item.label)).map(item => (
                                                                                        <button
                                                                                            key={item.id}

                                                                                            className="text-[10px] border border-gray-100 hover:border-green-300 hover:bg-green-50 px-2 py-1 rounded-full transition-colors text-left truncate max-w-full"
                                                                                        >
                                                                                            {item.label}
                                                                                        </button>

                                                            {tag}
                                                            {isEditMode && (
                                                                <button
                                                                    onClick={() => handleUpdate('tags', caseData.tags.filter((_, idx) => idx !== i))}
                                                                    className="text-green-400 hover:text-green-700"
                                                                >
                                                                    <span className="text-[10px]">✕</span>
                                                                </button>

                                                        </span>

                                                </div>

                        {/* Basic Info - New 2-Column Layout */}

                                                <div className="flex flex-col gap-2">
                                                    <div className="flex flex-wrap gap-2">

                                                            <span key={i} className="flex items-center gap-1 bg-gray-100 px-2 py-1 rounded text-sm">
